function renderPayDetailTraining(clientId) {
  const client = load('clients').find(c=>c.id===clientId);
  if (!client) return '<div class="empty">לקוח לא נמצא</div>';
  const today = localDateStr();
  const allSess = load('sessions').filter(s=>s.clientId===clientId&&s.type==='training'&&s.source!=='client'&&!s.punchCardId);
  const pays = load('payments').filter(p=>p.clientId===clientId&&p.status==='paid'&&!p.punchCardId);
  const entries = [];
  allSess.forEach(s=>entries.push({date:s.date,type:'session',desc:`אימון${s.notes?` — ${s.notes}`:''}`,amount:s.date<=today&&s.status!=='cancelled'?-(+s.price||0):0,cancelled:s.status==='cancelled',future:s.date>today}));
  pays.forEach(p=>entries.push({date:p.date,type:'payment',desc:`תשלום${p.notes?` — ${p.notes}`:''}`,amount:+p.amount||0,cancelled:false,future:false}));
  entries.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  let bal=0;
  const tableRows = entries.map(e=>{
    if (!e.cancelled&&!e.future) bal+=e.amount;
    const balColor=bal>=0?'#4caf50':'var(--accent)';
    const amtColor=e.type==='payment'?'#4caf50':'var(--accent)';
    if (e.cancelled) return `<tr style="opacity:.45;text-decoration:line-through"><td>${fmtDate(e.date)}</td><td>${esc(e.desc)}</td><td style="color:var(--muted)">—</td><td style="color:var(--muted)">—</td></tr>`;
    if (e.future) return `<tr style="opacity:.6;font-style:italic"><td>${fmtDate(e.date)}</td><td>${esc(e.desc)} <span style="font-size:.75rem;color:var(--accent2)">(עתידי)</span></td><td style="color:var(--muted)">—</td><td style="color:var(--muted)">—</td></tr>`;
    const amtStr=e.type==='payment'?`+₪${e.amount.toLocaleString()}`:`-₪${Math.abs(e.amount).toLocaleString()}`;
    const balStr=`₪${Math.abs(bal).toLocaleString()}${bal>0?' זיכוי':bal<0?' חוב':''}`;
    return `<tr><td>${fmtDate(e.date)}</td><td>${esc(e.desc)}</td><td style="color:${amtColor};font-weight:600">${amtStr}</td><td style="color:${balColor};font-weight:700">${balStr}</td></tr>`;
  });
  const finalColor=bal>=0?'#4caf50':'var(--accent)';
  const finalText=bal>0?`₪${bal.toLocaleString()} זיכוי`:bal<0?`₪${Math.abs(bal).toLocaleString()} חוב`:'₪0';
  return `<div class="card">
    <div class="section-header"><h2>${esc(client.name)}</h2><button class="btn btn-sm" onclick="openAddClientPayment('${clientId}')">+ הוסף תשלום</button></div>
    <div class="pay-summary" style="margin:12px 0">
      <div class="card"><div class="card-title">יתרה</div><div style="font-size:1.3rem;font-weight:700;color:${finalColor}">${finalText}</div></div>
    </div>
    ${tableRows.length?`<div class="table-wrap"><table><thead><tr><th>תאריך</th><th>תיאור</th><th>סכום</th><th>יתרה</th></tr></thead><tbody>${tableRows.join('')}</tbody></table></div>`:'<div class="empty">אין רשומות.</div>'}
  </div>`;
}

      <div class="card"><div class="card-title">שולם</div><div style="font-size:1.3rem;font-weight:700;color:#4caf50">₪${totalPaid.toLocaleString()}</div></div>

      <div id="pc-existing-section">
        <div class="form-group"><label>בחר כרטיסייה</label>

function selectCardMode(mode) {
  const isNew = mode === 'new';
  const bE=document.getElementById('pc-mode-btn-existing'), bN=document.getElementById('pc-mode-btn-new');
  const sE=document.getElementById('pc-existing-section'), sN=document.getElementById('pc-new-section');
  if (bE){bE.style.background=isNew?'var(--card)':'var(--gold)';bE.style.color=isNew?'var(--muted)':'#fff';bE.style.fontWeight=isNew?'400':'600';}
  if (bN){bN.style.background=isNew?'var(--gold)':'var(--card)';bN.style.color=isNew?'#fff':'var(--muted)';bN.style.fontWeight=isNew?'600':'400';}
  if (sE) sE.style.display = isNew ? 'none' : '';
  if (sN) sN.style.display = isNew ? '' : 'none';
  const v=document.getElementById('pc-mode-value'); if(v) v.value=mode;
}
function selectPlanMode(mode) {
  const isNew = mode === 'new';
  const bE=document.getElementById('plan-mode-btn-existing'), bN=document.getElementById('plan-mode-btn-new');
  const sE=document.getElementById('plan-existing-section'), sN=document.getElementById('plan-new-section');
  if (bE){bE.style.background=isNew?'var(--card)':'var(--gold)';bE.style.color=isNew?'var(--muted)':'#fff';bE.style.fontWeight=isNew?'400':'600';}
  if (bN){bN.style.background=isNew?'var(--gold)':'var(--card)';bN.style.color=isNew?'#fff':'var(--muted)';bN.style.fontWeight=isNew?'600':'400';}
  if (sE) sE.style.display = isNew ? 'none' : '';
  if (sN) sN.style.display = isNew ? '' : 'none';
  const v=document.getElementById('plan-mode-value'); if(v) v.value=mode;
}
function filterPurchasePunchCards(q) {
  const dd=document.getElementById('purch-pc-dd'); if(!dd) return;
  dd.style.display='';
  dd.querySelectorAll('.pc-opt').forEach(el=>{el.style.display=(el.dataset.name||'').toLowerCase().includes(q.toLowerCase())||!q?'':'none';});
}
function selectPurchasePunchCard(id, name, price) {
  const val=document.getElementById('purch-pc-val'), search=document.getElementById('purch-pc-search'), dd=document.getElementById('purch-pc-dd');
  if(val) val.value=id; if(search) search.value=name; if(dd) dd.style.display='none';
  if(price){const amt=document.querySelector('[name=amount]');if(amt&&!amt.value)amt.value=price;}
}
function filterPurchasePlans(q) {
  const dd=document.getElementById('purch-plan-dd'); if(!dd) return;
  dd.style.display='';
  dd.querySelectorAll('.pl-opt').forEach(el=>{el.style.display=(el.dataset.name||'').toLowerCase().includes(q.toLowerCase())||!q?'':'none';});
}
function selectPurchasePlan(id, name, price) {
  const val=document.getElementById('purch-plan-val'), search=document.getElementById('purch-plan-search'), dd=document.getElementById('purch-plan-dd');
  if(val) val.value=id; if(search) search.value=name; if(dd) dd.style.display='none';
  if(price){const amt=document.querySelector('[name=amount]');if(amt&&!amt.value)amt.value=price;}
}
function selectPurchaseProduct(product) {
  ['session','card','plan'].forEach(p=>{
    const b=document.getElementById(`prod-btn-${p}`);
    if(b){b.style.background=p===product?'var(--gold)':'var(--card)';b.style.color=p===product?'#fff':'var(--muted)';b.style.fontWeight=p===product?'600':'400';}
  });
  const v=document.getElementById('prod-value'); if(v) v.value=product;
  const cf=document.getElementById('prod-card-fields'); if(cf) cf.style.display=product==='card'?'block':'none';
  const pf=document.getElementById('prod-plan-fields'); if(pf) pf.style.display=product==='plan'?'block':'none';
  const lbl=document.getElementById('amount-label');
  if(lbl) lbl.textContent=product==='session'?'סכום תשלום (₪) *':'סכום ששולם (₪) *';
}
function paymentFormHTML(p={}, lockedClientId=null) {
  const method = p.paymentMethod||'';
  const transfer = p.transferMethod||'';
  const methBtns = ['cash','transfer','check','other'].map(m=>{
    const lbl={cash:'מזומן',transfer:'העברה',check:"צ'ק",other:'אחר'}[m];
    const active=m===method;
    return `<button type="button" onclick="selectPayMethod('${m}')" id="pm-btn-${m}" style="padding:8px 18px;border:none;cursor:pointer;font-family:inherit;font-size:.9rem;transition:all .15s;${active?'background:var(--gold);color:#fff;font-weight:600':'background:var(--card);color:var(--muted)'}">${lbl}</button>`;
  }).join('');
  const transBtns = ['bit','paybox','bank','other_transfer'].map(m=>{
    const lbl={bit:'ביט',paybox:'פייבוקס',bank:'העברה בנקאית',other_transfer:'אחר'}[m];
    const active=m===transfer;
    return `<button type="button" onclick="selectTransferMethod('${m}')" id="tm-btn-${m}" style="padding:7px 14px;border:none;cursor:pointer;font-family:inherit;font-size:.85rem;transition:all .15s;${active?'background:var(--gold);color:#fff;font-weight:600':'background:var(--card);color:var(--muted)'}">${lbl}</button>`;
  }).join('');
  const clientSel = lockedClientId ? '' : `<div class="form-group"><label>לקוח *</label><select name="clientId" required><option value="">— בחר לקוח —</option>${clientOptions(p.clientId||'')}</select></div>`;
  return `<form id="modal-form">
    ${clientSel}
    <div class="form-row">
      <div class="form-group"><label>סכום (₪) *</label><input name="amount" type="number" min="0" step="1" value="${esc(p.amount||'')}" required></div>
      <div class="form-group"><label>תאריך *</label><input name="date" type="date" value="${esc(p.date||localDateStr())}" required></div>
    </div>
    <div class="form-group">
      <label>אמצעי תשלום</label>
      <div style="display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--border);width:fit-content">${methBtns}</div>
      <input type="hidden" name="paymentMethod" id="pm-value" value="${esc(method)}">
    </div>
    <div id="pm-transfer-opts" style="display:${method==='transfer'?'block':'none'}">
      <div class="form-group">
        <label>סוג העברה</label>
        <div style="display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--border);width:fit-content">${transBtns}</div>
        <input type="hidden" name="transferMethod" id="tm-value" value="${esc(transfer)}">
      </div>
    </div>
    <div class="form-group"><label>הערות</label><input name="notes" placeholder="הערה נוספת..." value="${esc(p.notes||'')}"></div>
    <div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">ביטול</button><button type="submit" class="btn">שמור</button></div>
  </form>`;
}
function selectPayMethod(m) {
  ['cash','transfer','check','other'].forEach(x=>{
    const b=document.getElementById(`pm-btn-${x}`);
    if(b){b.style.background=x===m?'var(--gold)':'var(--card)';b.style.color=x===m?'#fff':'var(--muted)';b.style.fontWeight=x===m?'600':'400';}
  });
  const v=document.getElementById('pm-value'); if(v) v.value=m;
  const t=document.getElementById('pm-transfer-opts'); if(t) t.style.display=m==='transfer'?'block':'none';
}
function selectTransferMethod(m) {
  ['bit','paybox','bank','other_transfer'].forEach(x=>{
    const b=document.getElementById(`tm-btn-${x}`);
    if(b){b.style.background=x===m?'var(--gold)':'var(--card)';b.style.color=x===m?'#fff':'var(--muted)';b.style.fontWeight=x===m?'600':'400';}
  });
  const v=document.getElementById('tm-value'); if(v) v.value=m;
}
function fmtPayMethod(p) {
  const ml={cash:'מזומן',transfer:'העברה',check:"צ'ק",other:'אחר'};
  const tl={bit:'ביט',paybox:'פייבוקס',bank:'העברה בנקאית',other_transfer:'אחר'};
  if(!p.paymentMethod) return '—';
  if(p.paymentMethod==='transfer'&&p.transferMethod) return tl[p.transferMethod]||'העברה';
  return ml[p.paymentMethod]||'—';
}
function filterIncomeRows() {
  const inp = document.getElementById('pay-client-search');
  if (!inp) return;
  _paySummaryClientQ = inp.value;
  const q = inp.value.trim().toLowerCase();
  const payments = load('payments').filter(p=>p.status==='paid');
  let filtered = payments;
  if (_paySummaryMonth) filtered=filtered.filter(p=>(p.date||'').startsWith(_paySummaryMonth));
  if (q) filtered=filtered.filter(p=>(clientName(p.clientId)||'').toLowerCase().includes(q));
  filtered.sort((a,b)=>a.date<b.date?1:-1);
  const total = filtered.reduce((s,p)=>s+(+p.amount||0),0);
  const clientLabel = q ? `"${inp.value}"` : 'כל הלקוחות';
  const monthLabel = _paySummaryMonth
    ? new Date(+_paySummaryMonth.split('-')[0], +_paySummaryMonth.split('-')[1]-1, 1).toLocaleDateString('he-IL',{month:'long'})
    : 'כל הזמנים';
  const title = document.getElementById('pay-table-title');
  if (title) title.textContent = `${clientLabel}, ${_paySummaryMonth?'חודש ':''}${monthLabel}`;
  const tbody = document.getElementById('pay-income-tbody');
  if (!tbody) return;
  const rows = filtered.length ? filtered.map(p=>`<tr>
    <td>${fmtDate(p.date)}</td>
    <td>${p.clientId?`<a href="#" onclick="event.preventDefault();switchTab('clients');openClientProfile('${p.clientId}')" style="color:var(--accent2);text-decoration:none">${esc(clientName(p.clientId))}</a>`:'—'}</td>
    <td style="color:#4caf50;font-weight:600">₪${(+p.amount||0).toLocaleString()}</td>
    <td style="font-size:.85rem;color:var(--accent2)">${fmtPayMethod(p)}</td>
    <td style="color:var(--muted);font-size:.85rem">${esc(p.notes||'—')}</td>
    <td class="actions" style="text-align:left">
      <button class="btn btn-ghost btn-sm" onclick="openEditPayment('${p.id}')">עריכה</button>
      <button class="btn btn-danger btn-sm" onclick="deletePayment('${p.id}')">מחק</button>
    </td>
  </tr>`).join('') : `<tr><td colspan="6" style="text-align:center;color:var(--muted)">אין תשלומים בתקופה זו</td></tr>`;
  tbody.innerHTML = rows;
  const tfoot = tbody.closest('table')?.querySelector('tfoot');
  if (tfoot) tfoot.innerHTML = filtered.length ? `<tr style="font-weight:700;background:rgba(255,255,255,.04);border-top:2px solid var(--border)">
    <td colspan="2" style="color:var(--muted);font-size:.85rem">${filtered.length} תשלומים</td>
    <td style="color:#4caf50">₪${total.toLocaleString()}</td><td colspan="3"></td></tr>` : '';
}
function openAddPayment() {
  if (!load('clients').length) { alert('יש להוסיף לקוח.'); return; }
  openModal('הוסף תשלום / רכישה', purchaseFormHTML(null), async fd => {
    const product = fd.get('product')||'session';
    const clientId = fd.get('clientId');
    const date = fd.get('date'), method = fd.get('paymentMethod')||'', transfer = fd.get('transferMethod')||'', notes = fd.get('notes')||'', amount = fd.get('amount');
    if (product === 'card') {
      const pcMode = fd.get('pcMode')||'new';
      if (pcMode === 'existing') {
        const existingPcId = fd.get('existingPcId');
        if (!existingPcId) { alert('יש לבחור כרטיסייה קיימת'); return; }
        const pc = load('punchCards').find(x=>x.id===existingPcId);
        await saveItem('payments', {id:uid(), clientId:pc?.ownerClientId||clientId, amount, date, status:'paid', punchCardId:existingPcId, paymentMethod:method, transferMethod:transfer, notes});
      } else {
        const pcId = uid();
        await saveItem('punchCards', {id:pcId, ownerClientId:clientId, name:fd.get('pcName')||'כרטיסייה', totalSessions:+(fd.get('pcSessions')||0), price:fd.get('pcPrice')||'0', linkedClientIds:[], notes:'', createdAt:new Date().toISOString()});
        await saveItem('payments', {id:uid(), clientId, amount, date, status:'paid', punchCardId:pcId, paymentMethod:method, transferMethod:transfer, notes});
      }
    } else if (product === 'plan') {
      const planMode = fd.get('planMode')||'new';
      if (planMode === 'existing') {
        const existingPlanId = fd.get('existingPlanId');
        if (!existingPlanId) { alert('יש לבחור תוכנית קיימת'); return; }
        await saveItem('payments', {id:uid(), clientId, amount, date, status:'paid', paymentMethod:method, transferMethod:transfer, notes});
      } else {
        await saveItem('plans', {id:uid(), clientId, name:fd.get('planName')||'תוכנית אימונים', price:fd.get('planPrice')||'0', isTemplate:false, exercises:[], notes:'', createdAt:new Date().toISOString()});
        await saveItem('payments', {id:uid(), clientId, amount, date, status:'paid', paymentMethod:method, transferMethod:transfer, notes});
      }
    } else {
      await saveItem('payments', {id:uid(), clientId, amount, date, status:'paid', paymentMethod:method, transferMethod:transfer, notes});
    }
    renderPayments();
  });
}
function openEditPayment(id) {
  const p = load('payments').find(x=>x.id===id);
  openModal('עריכת תשלום', paymentFormHTML(p), async fd => {
    Object.assign(p, {clientId:fd.get('clientId')||p.clientId, amount:fd.get('amount'), date:fd.get('date'), paymentMethod:fd.get('paymentMethod')||p.paymentMethod||'', transferMethod:fd.get('transferMethod')||p.transferMethod||'', notes:fd.get('notes')||''});
    await saveItem('payments', p);
    if (_clientProfile.active) renderClientProfile(); else renderPayments();
  });
}
async function togglePayment(id) {
  const p = load('payments').find(x=>x.id===id);
  const wasPending = p.status === 'pending';
  p.status = p.status==='paid'?'pending':'paid';
  await saveItem('payments', p); renderPayments();
  if (wasPending && p.status === 'paid') {
    if (confirm('התשלום סומן כשולם. להנפיק מסמך ב-Morning?')) {
      openIssueDocument(id);
    }
  }
}
async function deletePayment(id) {
  if (!confirm('למחוק תשלום זה?')) return;
  await deleteItem('payments', id); renderPayments();
}

function renderReminders() {
  const sessions = trainerSessions(), clients = load('clients');
  const today = new Date(); today.setHours(0,0,0,0);
  const limit = new Date(today); limit.setDate(limit.getDate()+7);
  const upcoming = sessions
    .filter(s=>{ const d=new Date(s.date+'T00:00'); return d>=today&&d<=limit; })
    .sort((a,b)=>(a.date+(a.time||a.startTime||''))<(b.date+(b.time||b.startTime||''))?-1:1);
  const container = document.getElementById('reminders-list');
  if (!upcoming.length) { container.innerHTML='<div class="empty">אין אימונים ב-7 הימים הקרובים.</div>'; return; }
  const todayStr = localDateStr();
  container.innerHTML = upcoming.map(s => {
    const isShift = s.type === 'shift';
    const client = clients.find(c=>c.id===s.clientId)||{};
    const isToday = s.date===todayStr;
    if (isShift) {
      const hrs = calcShiftHours(s.startTime, s.endTime);
      return `<div class="reminder-card${isToday?' today-card':''}">
        <div class="reminder-info">
          <h3>${isToday?'<span class="reminder-tag">היום</span>':''}<span class="badge badge-shift">משמרת</span></h3>
          <p>${fmtDateLong(s.date)} · ${esc(s.startTime||'')}–${esc(s.endTime||'')} · ${hrs.toFixed(1)} שעות</p>
          ${s.notes?`<p style="margin-top:4px">${esc(s.notes)}</p>`:''}
        </div>
      </div>`;
    }
    const intl = (client.phone||'').replace(/\D/g,'').replace(/^0/,'972');

const MORNING_CONFIG = {
  apiKey:    'YOUR_API_KEY',
  apiSecret: 'YOUR_API_SECRET',
  baseUrl:   'https://api.greeninvoice.co.il/api/v1'
};

let _morningToken = null;
let _morningTokenExp = 0;

async function morningGetToken() {
  if (_morningToken && Date.now() < _morningTokenExp) return _morningToken;
  const res = await fetch(MORNING_CONFIG.baseUrl + '/account/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: MORNING_CONFIG.apiKey, secret: MORNING_CONFIG.apiSecret })
  });
  if (!res.ok) throw new Error('Morning auth failed: ' + res.status);
  const data = await res.json();
  _morningToken = data.token;
  _morningTokenExp = Date.now() + 55 * 60 * 1000;
  return _morningToken;
}

async function morningCreateDocument(docData) {
  const token = await morningGetToken();
  const res = await fetch(MORNING_CONFIG.baseUrl + '/documents', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify(docData)
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.errorMessage || 'Morning API error: ' + res.status);
  }
  return await res.json();
}

  const clients = load('clients');
  let count = 0;
  for (const c of clients) {

      await saveItem('payments', {

        date: localDateStr(),
        status: 'paid',
        notes: 'סגירת יתרה ידנית',

      count++;
    }
  }
  showToast(`נוצרו ${count} תשלומים — כל החובות סגורים ✓`);
  renderPayments();
}

async function handleAddTrainer(e) {
  e.preventDefault();
  const name = document.getElementById('new-trainer-name').value.trim();
  const phone = document.getElementById('new-trainer-phone').value.trim();
  if (!name || !phone) {
    document.getElementById('add-trainer-error').textContent = 'מלא את כל השדות';

  if (phone.replace(/\D/g, '').length < 9) {
    document.getElementById('add-trainer-error').textContent = 'מספר טלפון לא תקין';
    return;
  }

  if (exists) {
    document.getElementById('add-trainer-error').textContent = 'מספר טלפון כבר רשום במערכת';

  await db.collection('trainers').add({ name, phone, isAdmin: false, createdAt: new Date().toISOString() });

async function migrateOrphanData() {
  if (!confirm('לשייך את כל הנתונים ללא בעלות אליך?')) return;
  let count = 0;
  for (const col of ['clients','sessions','plans','payments']) {
    const snap = await db.collection(col).get();
    const orphans = snap.docs.filter(d => !d.data().trainerId);
    for (const d of orphans) {
      await db.collection(col).doc(d.id).update({ trainerId: currentTrainerId });
      const cached = cache[col].find(x => x.id === d.id);
      if (cached) cached.trainerId = currentTrainerId;
      count++;
    }
  }
  alert(`שויכו ${count} רשומות בהצלחה`);
  renderAdmin();
}

  if (!phone) {
    document.getElementById('login-error').textContent = 'הזן מספר טלפון';
    return;
  }
  try {
    const snap = await db.collection('trainers').get();
    const trainer = snap.docs.find(d => d.data().phone.replace(/\D/g, '') === phone);
    if (!trainer) {
      document.getElementById('login-error').textContent = 'מספר טלפון לא נמצא';

    const data = trainer.data();

      return;
    }
    // Normal login — verify pin
    if (!pin) {
      document.getElementById('login-error').textContent = 'הזן סיסמה';
      return;
    }
    if (pin !== data.pin) {
      document.getElementById('login-error').textContent = 'סיסמה שגויה';
      document.getElementById('login-pin').value = '';
      document.getElementById('login-pin').focus();
      return;
    }
    loginAsTrainer(trainer);
  } catch(err) {
    console.error(err);
    document.getElementById('login-error').textContent = 'שגיאה בחיבור';
  }
}

  }
  if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
    document.getElementById('set-pin-error').textContent = 'הסיסמה חייבת להיות 4 ספרות';
    return;
  }
  if (pin !== pinConfirm) {
    document.getElementById('set-pin-error').textContent = 'הסיסמאות לא תואמות';
    return;
  }
  try {
    await db.collection('trainers').doc(_pendingTrainerId).update({ pin });
    const snap = await db.collection('trainers').doc(_pendingTrainerId).get();
    loginAsTrainer(snap);
  } catch(err) {
    console.error(err);
    document.getElementById('set-pin-error').textContent = 'שגיאה בשמירה';
  }
}

function loginAsTrainer(trainerDoc) {
  const data = trainerDoc.data ? trainerDoc.data() : trainerDoc;
  currentTrainerId = trainerDoc.id;
  currentTrainerName = data.name;
  currentTrainerIsAdmin = data.isAdmin === true;
  localStorage.setItem('ft_auth', 'yes');
  localStorage.setItem('ft_trainerId', currentTrainerId);
  localStorage.setItem('ft_trainerName', currentTrainerName);
  localStorage.setItem('ft_trainerIsAdmin', currentTrainerIsAdmin ? 'yes' : 'no');
  document.getElementById('login-screen').style.display = 'none';
  init();
}

function handleLogout() {
  localStorage.removeItem('ft_auth');
  localStorage.removeItem('ft_trainerId');
  localStorage.removeItem('ft_trainerName');
  localStorage.removeItem('ft_trainerIsAdmin');
  currentTrainerId = null;
  currentTrainerName = '';
  currentTrainerIsAdmin = false;
  location.reload();
}

// ========================
// ===== INIT =============
// ========================
async function init() {
  document.getElementById('loading-overlay').style.display = 'flex';
  try {
    await initDB();
    document.getElementById('loading-overlay').style.display = 'none';
    if (currentTrainerIsAdmin) {
      const adminTab = document.getElementById('nav-admin-tab');
      if (adminTab) adminTab.style.display = '';
      const mobileAdminTab = document.getElementById('mobile-admin-tab');
      if (mobileAdminTab) mobileAdminTab.style.display = '';
    }
    switchTab('schedule');
  } catch(err) {
    console.error(err);
    document.getElementById('loading-overlay').innerHTML = `
      <div class="loading-box">
        <p style="color:var(--accent);font-size:1.1rem">⚠️ שגיאה בחיבור</p>
        <small style="margin-top:12px;line-height:1.6">
          ודא שיצרת <strong>Firestore Database</strong> בפרויקט Firebase<br>
          Firebase Console → Firestore Database → Create database
        </small>
        <button class="btn" style="margin-top:16px" onclick="init()">נסה שוב</button>
      </div>`;
  }
}

if (localStorage.getItem('ft_auth') === 'yes' && localStorage.getItem('ft_trainerId')) {
  currentTrainerId = localStorage.getItem('ft_trainerId');
  currentTrainerName = localStorage.getItem('ft_trainerName') || '';
  currentTrainerIsAdmin = localStorage.getItem('ft_trainerIsAdmin') === 'yes';
  document.getElementById('login-screen').style.display = 'none';
  init();
} else {
  checkFirstTime();
}
</script>
</body>
