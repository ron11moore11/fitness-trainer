function editSingleSession(id) {
  const s = load('sessions').find(x=>x.id===id);
  const oldPlanId = s.planId || '';
  const oldWorkoutIdx = s.workoutIdx || 0;
  openModal('עריכה', sessionForm(s), async fd => {
    const sessionType = fd.get('type');
    const isShift = sessionType === 'shift';
    const newPlanId = isShift ? '' : (fd.get('planId') || '');
    const newWorkoutIdx = isShift ? 0 : +(fd.get('workoutIdx') || 0);
    // Clear log if plan/workout changed so exercises reload from new plan

      s.log = [];
    }
    Object.assign(s, {
      type: sessionType,
      clientId: isShift ? '' : fd.get('clientId'),
      planId: newPlanId,
      workoutIdx: newWorkoutIdx,
      date: fd.get('date'),
      time: isShift ? '' : fd.get('time'),
      duration: isShift ? '' : fd.get('duration'),
      startTime: isShift ? fd.get('startTime') : '',
      endTime: isShift ? fd.get('endTime') : '',
      hourlyRate: isShift ? fd.get('hourlyRate') : '',
      notes: fd.get('notes'),

let _logData = [];

function openLiveWorkout(sessionId) {
  const s = load('sessions').find(x=>x.id===sessionId);
  if (!s) return;
  let log;
  if (s.log && s.log.length) {
    log = JSON.parse(JSON.stringify(s.log));
  } else if (s.planId) {
    const plan = load('plans').find(p=>p.id===s.planId);
    if (plan) {
      const workouts = getPlanWorkouts(plan);
      const workout = workouts[s.workoutIdx||0] || workouts[0];
      if (workout && workout.exercises.length) {
        log = workout.exercises.map(e => {
          const ex = migrateExercise(e);
          return { exerciseName:ex.name, category:ex.category||'', videoUrl:ex.videoUrl||'',
            sets:ex.setsData.map(sd=>({ targetReps:+sd.targetReps||0, reps:'', weight:sd.weight||'', notes:sd.notes||'' })) };
        });
      } else { log = []; }
    } else { log = []; }
  } else { log = []; }
  _liveWorkout = { active:true, sessionId, currentIdx:0, log, session:s, previousData:{}, saveTimer:null, showSwapBrowser:false, swapExpandedCat:'' };
  loadPreviousSessionData(s.clientId, log);
  renderSchedule();
}
function loadPreviousSessionData(clientId, log) {
  const past = load('sessions').filter(s=>s.clientId===clientId&&s.log&&s.log.length&&s.id!==_liveWorkout.sessionId).sort((a,b)=>b.date.localeCompare(a.date));
  const prev = {};
  for (const ex of log) {
    for (const s of past) {
      const entry = s.log.find(l=>l.exerciseName===ex.exerciseName);
      if (entry) { prev[ex.exerciseName] = { sets:entry.sets, date:s.date }; break; }
    }
  }
  _liveWorkout.previousData = prev;
}

  <div class="live-nav">
    <button class="btn btn-ghost" onclick="livePrev()" ${idx===0?'disabled':''}>← הקודם</button>
    <button class="btn" onclick="${idx>=total-1?'closeLiveWorkout()':'liveNext()'}">${idx>=total-1?'סיום ✓':'הבא →'}</button>
  </div>`;
}

function liveNext() { if(_liveWorkout.currentIdx<_liveWorkout.log.length-1){_liveWorkout.currentIdx++;updateLiveCard();} }
function livePrev() { if(_liveWorkout.currentIdx>0){_liveWorkout.currentIdx--;updateLiveCard();} }
function updateLiveCard() {
  const container = document.getElementById('live-card-container');
  if(container) container.innerHTML = renderLiveCard();
  document.querySelector('.live-progress').textContent = `תרגיל ${_liveWorkout.currentIdx+1} מתוך ${_liveWorkout.log.length}`;
}
function liveAddSet(idx) {
  _liveWorkout.log[idx].sets.push({targetReps:'',reps:'',weight:'',notes:''});
  updateLiveCard(); liveAutoSave();
}
function liveRemoveSet(idx, si) {
  _liveWorkout.log[idx].sets.splice(si,1);
  if(!_liveWorkout.log[idx].sets.length) _liveWorkout.log[idx].sets.push({targetReps:'',reps:'',weight:'',notes:''});
  updateLiveCard(); liveAutoSave();
}
function liveShowSwap() {
  _liveWorkout.showSwapBrowser=true; _liveWorkout.swapExpandedCat='';
  // Remove old overlay if exists
  document.querySelector('.live-swap-overlay')?.remove();
  // Append overlay to body so it's always visible
  const div = document.createElement('div');
  div.innerHTML = renderLiveSwapOverlay();
  document.body.appendChild(div.firstElementChild);
}
function liveHideSwap() {
  _liveWorkout.showSwapBrowser=false;
  document.querySelector('.live-swap-overlay')?.remove();
}
function renderLiveSwapOverlay() {
  const allExercises = load('exercises');
  const cats = EX_CATS.filter(cat=>allExercises.some(e=>e.category===cat));
  let listHtml;
  if (_liveWorkout.swapExpandedCat) {
    const exs = allExercises.filter(e=>e.category===_liveWorkout.swapExpandedCat);
    listHtml = exs.map(e=>`<div class="pb-ex-item" onclick="liveConfirmSwap('${e.id}')">
      <div class="pb-ex-names"><div class="pb-ex-name">${esc(e.name)}</div>${e.nameEn?`<div class="pb-ex-name-en">${esc(e.nameEn)}</div>`:''}</div>
      <div class="pb-ex-actions"><button class="pb-ex-add" style="opacity:1">+</button></div>
    </div>`).join('');
  } else { listHtml = ''; }
  const catsHtml = cats.map(cat=>{
    const count = allExercises.filter(e=>e.category===cat).length;
    const isOpen = _liveWorkout.swapExpandedCat===cat;
    return `<button class="pb-group-btn${isOpen?' active':''}" onclick="_liveWorkout.swapExpandedCat=_liveWorkout.swapExpandedCat==='${cat}'?'':'${cat}';refreshSwapOverlay()"><span>${esc(cat)}</span><span class="pb-count">${count}</span></button>${isOpen?listHtml:''}`;
  }).join('');
  return `<div class="live-swap-overlay" onclick="liveHideSwap()">
    <div class="live-swap-panel" onclick="event.stopPropagation()">
      <div class="live-swap-panel-header"><span style="font-weight:600;color:var(--accent2)">החלף תרגיל</span><button class="ex-remove" onclick="liveHideSwap()" style="font-size:1.2rem">✕</button></div>
      ${catsHtml}
    </div>
  </div>`;
}
function liveAddExercise() {
  _liveWorkout.log.push({ exerciseName:'', category:'', videoUrl:'', sets:[{targetReps:'',reps:'',weight:'',notes:''}] });
  _liveWorkout.currentIdx = _liveWorkout.log.length - 1;
  updateLiveCard();
  liveAutoSave();
  // Open swap browser to pick the exercise
  liveShowSwap();
}
function refreshSwapOverlay() {
  document.querySelector('.live-swap-overlay')?.remove();
  const div = document.createElement('div');
  div.innerHTML = renderLiveSwapOverlay();
  document.body.appendChild(div.firstElementChild);
}
function liveConfirmSwap(exId) {
  const ex = load('exercises').find(e=>e.id===exId);
  if(!ex) return;
  const idx = _liveWorkout.currentIdx;
  const old = _liveWorkout.log[idx];
  _liveWorkout.log[idx] = { exerciseName:ex.name, category:ex.category||'', videoUrl:ex.videoUrl||'',
    sets:old.sets.length?old.sets:[{targetReps:10,reps:'',weight:'',notes:''}] };
  // Lookup previous data for new exercise
  const past = load('sessions').filter(s=>s.clientId===_liveWorkout.session.clientId&&s.log&&s.log.length&&s.id!==_liveWorkout.sessionId).sort((a,b)=>b.date.localeCompare(a.date));
  for (const s of past) {
    const entry = s.log.find(l=>l.exerciseName===ex.name);
    if (entry) { _liveWorkout.previousData[ex.name] = { sets:entry.sets, date:s.date }; break; }
  }
  _liveWorkout.showSwapBrowser = false;
  document.querySelector('.live-swap-overlay')?.remove();
  liveAutoSave();
  updateLiveCard();
  showToast(`הוחלף ל-${ex.name} ✓`);
}

function openWorkoutLog(sessionId) {
  const s = load('sessions').find(x => x.id === sessionId);
  if (!s) return;
  _logSessionId = sessionId;

  if (s.log && s.log.length) {
    _logData = JSON.parse(JSON.stringify(s.log));
  } else if (s.planId) {
    const plan = load('plans').find(p => p.id === s.planId);
    if (plan) {
      const workouts = getPlanWorkouts(plan);
      const workout = workouts[s.workoutIdx||0] || workouts[0];
      if (workout && workout.exercises.length) {
        _logData = workout.exercises.map(e => {
          const ex = migrateExercise(e);
          return {
            exerciseName: ex.name,
            category: ex.category || '',
            prescribedSets: ex.setsData.length,
            sets: ex.setsData.map(sd => ({
              targetReps: +sd.targetReps || 0,
              reps: '',
              weight: sd.weight || '',
              notes: sd.notes || ''
            }))
          };
        });
      } else { _logData = []; }
    } else {
      _logData = [];
    }
  } else {
    _logData = [];
  }

  const clientN = s.clientId ? clientName(s.clientId) : '';

  // Build workout selector
  const planOpts = s.clientId ? planOptionsForClient(s.clientId, s.planId||'') : '';
  let workoutOpts = '';
  if (s.planId) {
    workoutOpts = workoutOptionsForPlan(s.planId, s.workoutIdx||0);
  }

  let html = `<div class="log-header">
    <div class="log-header-info">
      ${clientN ? `<strong>לקוח:</strong> ${esc(clientN)}<br>` : ''}
      <strong>תאריך:</strong> ${fmtDateLong(s.date)}${s.time?' · '+esc(s.time):''}
    </div>
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">
      <div class="form-group" style="margin:0;flex:1;min-width:140px">
        <label>תוכנית</label>
        <select id="log-plan-sel" onchange="onLogPlanChange()">${planOpts}</select>
      </div>
      <div class="form-group" id="log-workout-group" style="margin:0;flex:1;min-width:120px${s.planId?'':';display:none'}">
        <label>אימון</label>
        <select id="log-workout-sel" onchange="onLogWorkoutChange()">${workoutOpts}</select>
      </div>
    </div>
  </div>`;
  html += `<div id="log-exercises-container">${renderLogExercises()}</div>`;
  html += `<button type="button" class="log-add-exercise" onclick="addLogExercise()">+ הוסף תרגיל</button>`;
  html += `<div class="form-actions">
    <button type="button" class="btn btn-ghost" onclick="closeModal()">ביטול</button>
    <button type="button" class="btn btn-log" onclick="saveWorkoutLog()">💾 שמור</button>
  </div>`;

  openModal('📋 יומן אימון', html, null);
}

function onLogPlanChange() {
  const planId = document.getElementById('log-plan-sel').value;
  const group = document.getElementById('log-workout-group');
  const sel = document.getElementById('log-workout-sel');
  if (planId) {
    group.style.display = '';
    sel.innerHTML = workoutOptionsForPlan(planId, 0);
  } else {
    group.style.display = 'none';
    sel.innerHTML = '';
  }
  onLogWorkoutChange();
}

function onLogWorkoutChange() {
  const s = load('sessions').find(x => x.id === _logSessionId);
  if (!s) return;
  const planId = document.getElementById('log-plan-sel').value;
  const workoutIdx = +(document.getElementById('log-workout-sel')?.value || 0);

  // Only reload exercises if plan/workout actually changed
  if (planId !== (s.planId||'') || workoutIdx !== (s.workoutIdx||0)) {
    if (planId) {
      const plan = load('plans').find(p => p.id === planId);
      if (plan) {
        const workouts = getPlanWorkouts(plan);
        const workout = workouts[workoutIdx] || workouts[0];
        if (workout && workout.exercises.length) {
          _logData = workout.exercises.map(e => {
            const ex = migrateExercise(e);
            return { exerciseName: ex.name, category: ex.category||'', sets: ex.setsData.map(sd => ({
              targetReps: +sd.targetReps||0, reps: '', weight: sd.weight||'', notes: sd.notes||''
            }))};
          });
        } else { _logData = []; }
      } else { _logData = []; }
    } else {
      _logData = [];
    }
    document.getElementById('log-exercises-container').innerHTML = renderLogExercises();
  }
}

function renderLogExercises() {
  if (!_logData.length) return '<div style="color:var(--muted);font-size:.85rem;padding:12px 0;text-align:center">אין תרגילים — לחץ ״הוסף תרגיל״</div>';
  return _logData.map((ex, ei) => {
    const setsHtml = ex.sets.map((set, si) => {
      const target = set.targetReps ? `(מטרה: ${set.targetReps})` : '';
      return `<div class="log-set-row">
        <span>סט ${si+1}</span>
        <input type="number" min="0" placeholder="חזרות ${target}" value="${set.reps||''}" oninput="_logData[${ei}].sets[${si}].reps=this.value">
        <input type="number" min="0" step="0.5" placeholder="משקל (ק״ג)" value="${set.weight||''}" oninput="_logData[${ei}].sets[${si}].weight=this.value">
        <input class="log-notes-input" placeholder="הערות" value="${esc(set.notes||'')}" oninput="_logData[${ei}].sets[${si}].notes=this.value">
        <button type="button" class="log-set-remove" onclick="removeLogSet(${ei},${si})">✕</button>
      </div>`;
    }).join('');
    return `<div class="log-exercise">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="flex:1">
          <input style="background:transparent;border:none;color:var(--accent2);font-weight:600;font-size:.95rem;padding:0;width:100%" value="${esc(ex.exerciseName)}" oninput="_logData[${ei}].exerciseName=this.value" placeholder="שם התרגיל">
        </div>
        <button type="button" class="ex-remove" onclick="removeLogExercise(${ei})">✕</button>
      </div>
      ${setsHtml}
      <button type="button" class="log-add-set" onclick="addLogSet(${ei})">+ הוסף סט</button>
    </div>`;
  }).join('');
}

function addLogSet(exIdx) {
  _logData[exIdx].sets.push({ targetReps: 0, reps: '', weight: '', notes: '' });
  document.getElementById('log-exercises-container').innerHTML = renderLogExercises();
}
function removeLogSet(exIdx, setIdx) {
  _logData[exIdx].sets.splice(setIdx, 1);
  if (!_logData[exIdx].sets.length) _logData[exIdx].sets.push({ targetReps: 0, reps: '', weight: '', notes: '' });
  document.getElementById('log-exercises-container').innerHTML = renderLogExercises();
}
function addLogExercise() {
  _logData.push({ exerciseName: '', category: '', sets: [{ targetReps: 0, reps: '', weight: '', notes: '' }] });
  document.getElementById('log-exercises-container').innerHTML = renderLogExercises();
}
function removeLogExercise(exIdx) {
  _logData.splice(exIdx, 1);
  document.getElementById('log-exercises-container').innerHTML = renderLogExercises();
}

async function saveWorkoutLog() {
  const s = load('sessions').find(x => x.id === _logSessionId);
  if (!s) return;
  // Update plan/workout if changed
  const logPlanSel = document.getElementById('log-plan-sel');
  const logWorkoutSel = document.getElementById('log-workout-sel');
  if (logPlanSel) s.planId = logPlanSel.value || '';
  if (logWorkoutSel) s.workoutIdx = +(logWorkoutSel.value || 0);
  const cleanLog = _logData
    .filter(ex => ex.exerciseName.trim())
    .map(ex => ({
      exerciseName: ex.exerciseName.trim(),
      category: ex.category || '',
      videoUrl: ex.videoUrl || '',
      sets: ex.sets.map(set => ({
        targetReps: +set.targetReps || 0,
        reps: +set.reps || 0,
        weight: +set.weight || 0,
        notes: (set.notes || '').trim()
      }))
    }));
  s.log = cleanLog;
  await saveItem('sessions', s);
  closeModal();
  if (document.querySelector('#tab-tracking.active')) renderTrackingContent();
  else { renderCalendar(); renderSessionsTable(); }
  showToast('היומן נשמר ✓');
}

// ========================
// ===== WORKOUT PLANS ====
// ========================
// New exercise format: { name, nameEn, category, videoUrl, setsData: [{targetReps, weight, notes}] }
// Plan builder state
let _planBuilder = { active:false, editingId:'', isTemplate:false, clientId:'', planName:'', workouts:[], activeWorkoutIdx:0, expandedCategory:'', searchTerm:'' };

// Backward compat: old plans have exercises[], new plans have workouts[]
function getPlanWorkouts(plan) {
  if (plan.workouts) return plan.workouts;
  return [{ name:'אימון A', exercises:(plan.exercises||[]).map(migrateExercise) }];
}

let _workoutsView = { mode:'list', selectedPlanId:'', search:'', tab:'clients' };

function renderWorkouts() {
  if (_planBuilder.active) { renderPlanBuilder(); return; }
  if (_workoutsView.mode === 'detail') { renderPlanDetail(); return; }

  const plans = load('plans');
  const templates = plans.filter(p=>p.isTemplate);
  const assigned  = plans.filter(p=>!p.isTemplate);
  const isT = _workoutsView.tab === 'templates';

  let html = `<div style="display:flex;justify-content:center;margin-bottom:16px">
    <div class="cal-view-toggle">
      <button class="cal-view-btn${!isT?' active':''}" onclick="_workoutsView.tab='clients';_workoutsView.search='';renderWorkouts()">תוכניות אישיות</button>
      <button class="cal-view-btn${isT?' active':''}" onclick="_workoutsView.tab='templates';_workoutsView.search='';renderWorkouts()">תבניות גנריות</button>
    </div>
  </div>`;

  if (isT) {
    if (!templates.length) { html+='<div class="empty">אין תבניות גנריות.</div>'; }
    else {
      html+=`<table class="plan-table"><thead><tr><th>שם תבנית</th><th>תאריך יצירה</th></tr></thead><tbody>`;
      templates.forEach(p => {
        const date = p.createdAt ? fmtDate(p.createdAt.slice(0,10)) : '—';
        html+=`<tr onclick="_workoutsView.mode='detail';_workoutsView.selectedPlanId='${p.id}';renderWorkouts()">
          <td class="plan-client-name">${esc(p.name)}</td>
          <td class="plan-date">${date}</td>
        </tr>`;
      });
      html+=`</tbody></table>`;
    }
  } else {
    html+=`<input class="pb-search" placeholder="חפש מתאמן..." value="${esc(_workoutsView.search)}" oninput="_workoutsView.search=this.value;renderWorkouts()" style="margin-bottom:16px;max-width:300px">`;
    if (!assigned.length) { html+='<div class="empty">אין תוכניות אישיות.</div>'; }
    else {
      const byClient = {};
      assigned.forEach(p => { const cId=p.clientId; if(!byClient[cId])byClient[cId]=[]; byClient[cId].push(p); });
      const search = _workoutsView.search.toLowerCase();
      html+=`<table class="plan-table"><thead><tr><th>מתאמן</th><th>שם תוכנית</th><th>תאריך יצירה</th></tr></thead><tbody>`;
      Object.entries(byClient).forEach(([cId, cPlans]) => {
        const name = clientName(cId);
        if (search && !name.toLowerCase().includes(search)) return;
        cPlans.forEach((p, idx) => {
          const displayName = cPlans.length > 1 ? `${name} ${idx+1}` : name;
          const date = p.createdAt ? fmtDate(p.createdAt.slice(0,10)) : '—';
          html+=`<tr onclick="_workoutsView.mode='detail';_workoutsView.selectedPlanId='${p.id}';renderWorkouts()">
            <td class="plan-client-name">${esc(displayName)}</td>
            <td>${esc(p.name||'—')}</td>
            <td class="plan-date">${date}</td>
          </tr>`;
        });
      });
      html+=`</tbody></table>`;
    }
  }
  document.getElementById('workouts-content').innerHTML = html;
}

function renderPlanDetail() {
  const plan = load('plans').find(p=>p.id===_workoutsView.selectedPlanId);
  if (!plan) { _workoutsView.mode='list'; renderWorkouts(); return; }
  const back = `<button class="btn btn-ghost" onclick="_workoutsView.mode='list';renderWorkouts()" style="margin-bottom:16px">← חזרה לרשימה</button>`;
  document.getElementById('workouts-content').innerHTML = back + planCardHTML(plan);
}

function planCardHTML(p) {
  const workouts = getPlanWorkouts(p);
  const workoutSections = workouts.map(w => {
    const exercises = w.exercises.map(migrateExercise);
    if (!exercises.length) return `<div style="color:var(--muted);font-size:.82rem;margin:4px 0">${esc(w.name)}: אין תרגילים</div>`;
    const exRows = exercises.map(e => {
      const repsDisplay = e.setsData.map(s => s.targetReps).join(', ');
      const weightsDisplay = e.setsData.some(s => s.weight) ? e.setsData.map(s => s.weight || '—').join(', ') : '—';
      return `<tr><td>${esc(e.category||'—')}</td><td>${e.videoUrl?`<a href="${esc(e.videoUrl)}" target="_blank" style="color:var(--accent2)">${esc(e.name)}</a>`:esc(e.name)}</td><td>${e.setsData.length}</td><td dir="ltr">${repsDisplay}</td><td dir="ltr">${weightsDisplay}</td></tr>`;
    }).join('');
    return `${workouts.length>1?`<div style="color:var(--gold);font-size:.82rem;font-weight:600;margin:8px 0 4px">${esc(w.name)}</div>`:''}
      <table class="ex-table"><thead><tr><th>קטגוריה</th><th>תרגיל</th><th>סטים</th><th>חזרות</th><th>משקל</th></tr></thead><tbody>${exRows}</tbody></table>`;
  }).join('');
  const totalEx = workouts.reduce((s,w)=>s+w.exercises.length,0);
  const assignBtn = p.isTemplate
    ? `<button class="btn btn-teal btn-sm" onclick="openAssignTemplate('${p.id}')">הקצה ללקוח</button>`
    : `<button class="btn wa-btn btn-sm" onclick="sendPlanToWhatsApp('${p.id}')">📲 שלח PDF</button>
       <button class="btn btn-teal btn-sm" onclick="sendPortalLink('${p.id}')">🔗 שלח לינק</button>`;
  return `<div class="plan-card${p.isTemplate?' tmpl-card':''}">
    <div class="plan-card-header">
      <div>
        <div class="plan-name">${esc(p.name)}</div>
        <div class="plan-client">${p.isTemplate?'<span class="badge badge-tmpl">תבנית גנרית</span>':`לקוח: <a href="#" onclick="event.preventDefault();switchTab('clients');openClientProfile('${p.clientId}')" style="color:var(--accent2);text-decoration:none">${esc(clientName(p.clientId))}</a>`}</div>
      </div>
    </div>
    ${totalEx?workoutSections:'<div style="color:var(--muted);font-size:.82rem">אין תרגילים</div>'}
    <div class="plan-card-actions">
      <button class="btn btn-ghost btn-sm" onclick="openPlanBuilder(false,'${p.id}')">עריכה</button>
      <button class="btn btn-teal btn-sm" onclick="exportPlanPDF(load('plans').find(x=>x.id==='${p.id}'))">📄 PDF</button>
      ${assignBtn}
      <button class="btn btn-danger btn-sm" onclick="deletePlan('${p.id}')">מחק</button>
    </div></div>`;
}

// ===== PLAN BUILDER =====
function openPlanBuilder(isTemplate=false, existingId='') {
  if (existingId) {
    const p = load('plans').find(x=>x.id===existingId);
    if (!p) return;
    _planBuilder = { active:true, editingId:existingId, isTemplate:p.isTemplate, clientId:p.clientId||'', planName:p.name, price:p.price||'',
      workouts:JSON.parse(JSON.stringify(getPlanWorkouts(p))), activeWorkoutIdx:0, expandedCategory:'', searchTerm:'' };
  } else {
    _planBuilder = { active:true, editingId:'', isTemplate, clientId:'', planName:'', price:'',
      workouts:[], activeWorkoutIdx:0, expandedCategory:'', searchTerm:'' };
  }
  renderWorkouts();
}
function closePlanBuilder() {
  _planBuilder.active = false;
  _workoutsView.mode = 'list';
  renderWorkouts();
}

function renderPlanBuilder() {
  document.getElementById('workouts-content').innerHTML = `<div class="plan-builder">
    <div class="plan-builder-left">
      <input class="pb-search" placeholder="חפש תרגיל..." value="${esc(_planBuilder.searchTerm)}" oninput="pbSearchExercises(this.value)">
      <div id="pb-browser">${renderExerciseBrowser()}</div>
    </div>
    <div class="plan-builder-right">
      <div class="pb-meta">
        <div class="form-group"><label>שם התוכנית *</label><input id="pb-plan-name" value="${esc(_planBuilder.planName)}" oninput="_planBuilder.planName=this.value" required></div>
        <div class="form-group" style="${_planBuilder.isTemplate?'display:none':''}"><label>מחיר (₪)</label><input id="pb-plan-price" type="number" min="0" step="1" value="${esc(_planBuilder.price||'')}" placeholder="0" oninput="_planBuilder.price=this.value"></div>
        <div class="form-group" id="pb-client-group" style="position:relative${_planBuilder.isTemplate?';display:none':''}">
          <label>לקוח</label>
          <input id="pb-client-search" placeholder="חפש לקוח..." value="${_planBuilder.clientId?esc(clientName(_planBuilder.clientId)):''}" oninput="pbFilterClients(this.value)" onfocus="pbShowClientDropdown()" onblur="setTimeout(()=>{const d=document.getElementById('pb-client-dropdown');if(d)d.style.display='none'},200)" autocomplete="off">
          <div id="pb-client-dropdown" class="pb-client-dropdown"></div>
        </div>
        <div class="form-group" style="min-width:auto;display:flex;align-items:center;gap:6px;padding-top:22px">
          <input type="checkbox" id="pb-tmpl-cb" ${_planBuilder.isTemplate?'checked':''} onchange="_planBuilder.isTemplate=this.checked;document.getElementById('pb-client-group').style.display=this.checked?'none':''">
          <label for="pb-tmpl-cb" style="margin:0;font-size:.82rem">תבנית גנרית</label>
        </div>
      </div>
      ${renderWorkoutTabs()}
      <div id="pb-workout-content">${renderWorkoutExercises()}</div>
      <div class="pb-save-bar">
        <button class="btn btn-ghost" onclick="if(confirm('לבטל את העריכה?'))closePlanBuilder()">ביטול</button>
        <button class="btn" onclick="savePlanFromBuilder()">שמור תוכנית</button>
      </div>
    </div>
  </div>`;
}

function renderExerciseBrowser() {
  const allExercises = load('exercises');
  const search = _planBuilder.searchTerm.toLowerCase();
  if (search) {
    const filtered = allExercises.filter(e => (e.name||'').toLowerCase().includes(search) || (e.nameEn||'').toLowerCase().includes(search));
    if (!filtered.length) return '<div class="pb-empty">לא נמצאו תרגילים</div>';
    return '<div class="pb-ex-list">' + filtered.map(e => pbExItemHTML(e)).join('') + '</div>';
  }
  const cats = EX_CATS.filter(cat => allExercises.some(e => e.category === cat));
  return cats.map(cat => {
    const count = allExercises.filter(e => e.category === cat).length;
    const isOpen = _planBuilder.expandedCategory === cat;
    let html = `<button class="pb-group-btn${isOpen?' active':''}" onclick="pbToggleCategory('${cat}')"><span>${esc(cat)}</span><span class="pb-count">${count}</span></button>`;
    if (isOpen) {
      const exs = allExercises.filter(e => e.category === cat);
      html += '<div class="pb-ex-list">' + exs.map(e => pbExItemHTML(e)).join('') + '</div>';
    }
    return html;
  }).join('');
}

function pbExItemHTML(e) {
  return `<div class="pb-ex-item" onclick="pbAddExercise('${e.id}')">
    <div class="pb-ex-names"><div class="pb-ex-name">${esc(e.name)}</div>${e.nameEn?`<div class="pb-ex-name-en">${esc(e.nameEn)}</div>`:''}</div>
    <div class="pb-ex-actions">
      ${e.videoUrl?`<a href="${esc(e.videoUrl)}" target="_blank" class="pb-video-icon" onclick="event.stopPropagation()">▶</a>`:''}
      <button class="pb-ex-add" onclick="event.stopPropagation();pbAddExercise('${e.id}')">+</button>
    </div>
  </div>`;
}

function pbFilterClients(term) {
  _planBuilder.clientId = '';
  pbShowClientDropdown();
}
function pbShowClientDropdown() {
  const input = document.getElementById('pb-client-search');
  const dropdown = document.getElementById('pb-client-dropdown');
  if (!dropdown || !input) return;
  const search = (input.value||'').toLowerCase();
  const clients = load('clients').filter(c => !search || (c.name||'').toLowerCase().includes(search));
  if (!clients.length) {
    dropdown.innerHTML = '<div class="pb-client-option" style="color:var(--muted)">לא נמצאו לקוחות</div>';
  } else {
    dropdown.innerHTML = clients.map(c =>
      `<div class="pb-client-option" onmousedown="pbSelectClient('${c.id}')">${esc(c.name)}</div>`
    ).join('');
  }
  dropdown.style.display = 'block';
}
function pbSelectClient(id) {
  _planBuilder.clientId = id;
  const c = load('clients').find(x=>x.id===id);
  const input = document.getElementById('pb-client-search');
  if (input) input.value = c ? c.name : '';
  const dropdown = document.getElementById('pb-client-dropdown');
  if (dropdown) dropdown.style.display = 'none';
}

function pbToggleCategory(cat) {
  _planBuilder.expandedCategory = _planBuilder.expandedCategory === cat ? '' : cat;
  document.getElementById('pb-browser').innerHTML = renderExerciseBrowser();
}
function pbSearchExercises(term) {
  _planBuilder.searchTerm = term;
  document.getElementById('pb-browser').innerHTML = renderExerciseBrowser();
}

function renderWorkoutTabs() {
  if (!_planBuilder.workouts.length) {
    return `<div class="pb-workout-tabs"><button class="pb-workout-tab pb-workout-tab-add" onclick="pbAddWorkout()">+ הוסף אימון</button></div>`;
  }
  const tabs = _planBuilder.workouts.map((w, i) =>
    `<button class="pb-workout-tab${i===_planBuilder.activeWorkoutIdx?' active':''}" onclick="pbSwitchWorkout(${i})" ondblclick="event.stopPropagation();pbRenameWorkout(${i})">${esc(w.name||'ללא שם')}${_planBuilder.workouts.length>1?` <span style="font-size:.7rem;cursor:pointer;margin-right:4px" onclick="event.stopPropagation();pbRemoveWorkout(${i})">✕</span>`:''}</button>`
  ).join('');
  return `<div class="pb-workout-tabs">${tabs}<button class="pb-workout-tab pb-workout-tab-add" onclick="pbAddWorkout()">+ הוסף אימון</button></div>`;
}

function renderWorkoutExercises() {
  const w = _planBuilder.workouts[_planBuilder.activeWorkoutIdx];
  if (!w) return '<div class="pb-empty">לחץ על "+ הוסף אימון" כדי להתחיל</div>';
  if (!w.exercises.length) return '<div class="pb-empty">לחץ על תרגיל מהמאגר כדי להוסיף</div>';
  return w.exercises.map((e, ei) => {
    const ex = migrateExercise(e);
    const wi = _planBuilder.activeWorkoutIdx;
    const setsHtml = ex.setsData.map((s, si) =>
      `<div class="ex-set-row">
        <span>סט ${si+1}</span>
        <input type="number" min="0" placeholder="חזרות" value="${s.targetReps||''}" oninput="_planBuilder.workouts[${wi}].exercises[${ei}].setsData[${si}].targetReps=this.value">
        <input type="number" min="0" step="0.5" placeholder="משקל" value="${s.weight||''}" oninput="_planBuilder.workouts[${wi}].exercises[${ei}].setsData[${si}].weight=this.value">
        <input class="ex-set-notes" placeholder="הערות" value="${esc(s.notes||'')}" oninput="_planBuilder.workouts[${wi}].exercises[${ei}].setsData[${si}].notes=this.value">
        <button type="button" class="ex-remove" onclick="pbRemoveSet(${wi},${ei},${si})" style="font-size:.85rem">✕</button>
      </div>`
    ).join('');
    return `<div class="pb-ex-card">
      <div class="pb-ex-card-header">
        <div>
          <span class="pb-ex-card-name">${ei+1}. ${ex.videoUrl?`<a href="${esc(ex.videoUrl)}" target="_blank">${esc(ex.name)}</a>`:esc(ex.name)}</span>
          <span class="badge badge-cat" style="margin-right:6px">${esc(ex.category||'—')}</span>
        </div>
        <div class="pb-ex-card-actions">
          ${ei>0?`<button onclick="pbMoveExercise(${wi},${ei},-1)">↑</button>`:''}
          ${ei<w.exercises.length-1?`<button onclick="pbMoveExercise(${wi},${ei},1)">↓</button>`:''}
          <button onclick="pbRemoveExercise(${wi},${ei})">✕</button>
        </div>
      </div>
      <div class="ex-sets-header"><span></span><span>חזרות</span><span>משקל</span><span>הערות</span><span></span></div>
      ${setsHtml}
      <button type="button" class="ex-add-set" onclick="pbAddSet(${wi},${ei})">+ הוסף סט</button>
    </div>`;
  }).join('');
}

function pbAddExercise(exId) {
  const ex = load('exercises').find(e=>e.id===exId);
  if (!ex) return;
  const w = _planBuilder.workouts[_planBuilder.activeWorkoutIdx];
  w.exercises.push({ name:ex.name, nameEn:ex.nameEn||'', category:ex.category||'', videoUrl:ex.videoUrl||'', setsData:[{targetReps:10,weight:'',notes:''},{targetReps:10,weight:'',notes:''},{targetReps:10,weight:'',notes:''}] });
  document.getElementById('pb-workout-content').innerHTML = renderWorkoutExercises();
  showToast(`${ex.name} נוסף ✓`);
}
function pbRemoveExercise(wi, ei) {
  _planBuilder.workouts[wi].exercises.splice(ei, 1);
  document.getElementById('pb-workout-content').innerHTML = renderWorkoutExercises();
}
function pbMoveExercise(wi, ei, dir) {
  const arr = _planBuilder.workouts[wi].exercises;
  const ni = ei + dir;
  if (ni < 0 || ni >= arr.length) return;
  [arr[ei], arr[ni]] = [arr[ni], arr[ei]];
  document.getElementById('pb-workout-content').innerHTML = renderWorkoutExercises();
}
function pbAddSet(wi, ei) {
  _planBuilder.workouts[wi].exercises[ei].setsData.push({targetReps:'', weight:'', notes:''});
  document.getElementById('pb-workout-content').innerHTML = renderWorkoutExercises();
}
function pbRemoveSet(wi, ei, si) {
  const sd = _planBuilder.workouts[wi].exercises[ei].setsData;
  sd.splice(si, 1);
  if (!sd.length) sd.push({targetReps:'', weight:'', notes:''});
  document.getElementById('pb-workout-content').innerHTML = renderWorkoutExercises();
}
function pbSwitchWorkout(idx) {
  _planBuilder.activeWorkoutIdx = idx;
  const tabsContainer = document.querySelector('.pb-workout-tabs');
  if (tabsContainer) tabsContainer.outerHTML = renderWorkoutTabs();
  document.getElementById('pb-workout-content').innerHTML = renderWorkoutExercises();
}
function pbAddWorkout() {
  const name = prompt('שם האימון:');
  if (!name || !name.trim()) return;
  _planBuilder.workouts.push({name:name.trim(), exercises:[]});
  _planBuilder.activeWorkoutIdx = _planBuilder.workouts.length - 1;
  renderPlanBuilder();
}
function pbRenameWorkout(idx) {
  const name = prompt('שם האימון:', _planBuilder.workouts[idx].name);
  if (name !== null && name.trim()) {
    _planBuilder.workouts[idx].name = name.trim();
    renderPlanBuilder();
  }
}
function pbRemoveWorkout(idx) {
  if (_planBuilder.workouts.length <= 1) { showToast('צריך לפחות אימון אחד'); return; }
  if (!confirm(`למחוק את "${_planBuilder.workouts[idx].name}"?`)) return;
  _planBuilder.workouts.splice(idx, 1);
  if (_planBuilder.activeWorkoutIdx >= _planBuilder.workouts.length) _planBuilder.activeWorkoutIdx = _planBuilder.workouts.length - 1;
  renderPlanBuilder();
}

async function savePlanFromBuilder() {
  if (!_planBuilder.planName.trim()) { document.getElementById('pb-plan-name').focus(); showToast('יש להזין שם תוכנית'); return; }
  const data = {
    clientId: _planBuilder.isTemplate ? '' : _planBuilder.clientId,
    name: _planBuilder.planName.trim(),
    price: _planBuilder.isTemplate ? '' : (_planBuilder.price ? +_planBuilder.price : ''),
    isTemplate: _planBuilder.isTemplate,
    workouts: _planBuilder.workouts.map(w => ({
      name: w.name,
      exercises: w.exercises.map(e => ({
        name: e.name, nameEn: e.nameEn||'', category: e.category||'', videoUrl: e.videoUrl||'',
        setsData: (e.setsData||[]).map(s => ({ targetReps:+s.targetReps||0, weight:s.weight||'', notes:s.notes||'' }))
      }))
    }))
  };
  try {
    if (_planBuilder.editingId) {
      const plan = load('plans').find(x=>x.id===_planBuilder.editingId);
      Object.assign(plan, data);
      delete plan.exercises; // remove legacy field
      await saveItem('plans', plan);
    } else {
      await saveItem('plans', {id:uid(), createdAt:new Date().toISOString(), ...data});
    }
    showToast('התוכנית נשמרה ✓');
    closePlanBuilder();
  } catch(err) { showToast('שגיאה בשמירה.'); }
}

async function deletePlan(id) {
  if (!confirm('למחוק תוכנית זו?')) return;
  await deleteItem('plans', id); renderWorkouts();
}
function openAssignTemplate(templateId) {
  const tmpl = load('plans').find(x=>x.id===templateId);
  if (!load('clients').length) { alert('יש להוסיף לקוח.'); return; }
  openModal('הקצה תבנית ללקוח', `<form id="modal-form">
    <p style="color:var(--muted);margin-bottom:16px;font-size:.9rem">עותק של "<strong>${esc(tmpl.name)}</strong>"</p>
    <div class="form-group"><label>לקוח *</label>${clientPickerHTML('clientId','','tmpl')}</div>
    <div class="form-group"><label>שם התוכנית</label><input name="planName" value="${esc(tmpl.name)}" required></div>
    <div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">ביטול</button><button type="submit" class="btn">צור</button></div>
  </form>`, async fd => {
    await saveItem('plans', {id:uid(), clientId:fd.get('clientId'), name:fd.get('planName'), isTemplate:false, workouts:JSON.parse(JSON.stringify(getPlanWorkouts(tmpl)))});
    renderWorkouts(); showToast('התוכנית הוקצתה ✓');
  });
}

function exportPlanPDF(plan) {
  if (!plan) return;
  const client = plan.clientId ? load('clients').find(c=>c.id===plan.clientId) : null;
  const today  = new Date().toLocaleDateString('he-IL',{year:'numeric',month:'long',day:'numeric'});
  const workouts = getPlanWorkouts(plan);
  const totalEx = workouts.reduce((s,w)=>s+w.exercises.length,0);

  const workoutSections = workouts.map((w, wi) => {
    const exercises = w.exercises.map(migrateExercise);
    let rowNum = 0;
    const rows = exercises.map(e => {
      return e.setsData.map((s, si) => {
        rowNum++;
        const isFirst = si === 0;
        const rowspan = isFirst ? ` rowspan="${e.setsData.length}"` : '';
        const catCell = isFirst ? `<td${rowspan} style="text-align:center;vertical-align:middle">${esc(e.category||'—')}</td>` : '';
        const nameLink = e.videoUrl ? `<a href="${esc(e.videoUrl)}" target="_blank" style="color:#c0392b;text-decoration:underline">${esc(e.name)}</a>` : esc(e.name);
        const videoLine = e.videoUrl ? `<div style="font-size:10px;color:#888;word-break:break-all;margin-top:2px">${esc(e.videoUrl)}</div>` : '';
        const nameCell = isFirst ? `<td${rowspan} style="vertical-align:middle"><strong>${nameLink}</strong>${videoLine}</td>` : '';
        return `<tr style="${rowNum%2===0?'background:#fdf2f2':''}">
          ${catCell}${nameCell}
          <td style="text-align:center">סט ${si+1}</td>
          <td style="text-align:center">${s.targetReps||'—'}</td>
          <td style="text-align:center"></td>
          <td style="text-align:center">${s.weight||'—'}</td>
          <td>${esc(s.notes||'')}</td>
        </tr>`;
      }).join('');
    }).join('');
    return `${workouts.length>1?`<h2 style="color:#c0392b;font-size:18px;margin:24px 0 8px">${esc(w.name)}</h2>`:''}
      <table><thead><tr><th>קטגוריה</th><th>תרגיל</th><th>סט</th><th>מטרת חזרות</th><th>חזרות שהצלחתי</th><th>משקל</th><th>הערות</th></tr></thead><tbody>${rows}</tbody></table>`;
  }).join('');

  const html = `<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8">
<title>תוכנית אימון — ${esc(plan.name)}</title>
<style>
  @media print { @page { margin: 15mm; } body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }
  body{font-family:Arial,sans-serif;direction:rtl;text-align:right;margin:40px;color:#222;background:#fff}
  h1{color:#c0392b;font-size:22px;border-bottom:3px solid #c0392b;padding-bottom:8px;margin-bottom:6px}
  h2{color:#c0392b;font-size:18px}
  .meta{color:#555;font-size:13px;margin-bottom:24px;line-height:2}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:16px}
  th{background:#c0392b;color:#fff;padding:10px 12px;border:1px solid #a93226}
  td{padding:8px 12px;border:1px solid #ddd}
  a{color:#c0392b}
  .footer{margin-top:28px;font-size:11px;color:#aaa;border-top:1px solid #eee;padding-top:10px;text-align:center}
  .no-print{margin-bottom:20px}
  @media print{.no-print{display:none}}
</style></head>
<body>
  <div class="no-print"><button onclick="window.print()" style="padding:10px 24px;font-size:14px;cursor:pointer;background:#c0392b;color:#fff;border:none;border-radius:8px">📄 שמור כ-PDF</button></div>
  <h1>💪 תוכנית אימון: ${esc(plan.name)}</h1>
  <div class="meta">
    ${client?`<strong>מתאמן/ת:</strong> ${esc(client.name)}<br>`:'<strong>תבנית גנרית</strong><br>'}
    <strong>תאריך:</strong> ${today}<br>
    <strong>מספר תרגילים:</strong> ${totalEx}${workouts.length>1?` · <strong>אימונים:</strong> ${workouts.length}`:''}
  </div>
  ${workoutSections}

let _trackingClientId = '';
let _trackingSessionIdx = 0;
let _trackingChartExercise = '';
let _trackingSubTab = 'sessions'; // 'sessions' | 'charts'
let _trackingChartSelectedEx = '';
let _trackingChartMode = 'weight'; // 'weight' | 'reps'

function openTracking(clientId) {
  switchTab('clients');
  openClientProfile(clientId);
}

function selectTrackingSession(idx) {
  _trackingSessionIdx = idx;
  _trackingChartExercise = '';
  renderTrackingContent();
}

async function deleteTrackingSession(id) {
  if (!confirm('למחוק את האימון? זה ימחק גם מהיומן.')) return;
  await deleteItem('sessions', id);
  _trackingSessionIdx = -1;
  renderTrackingContent();
  showToast('האימון נמחק ✓');
}

function toggleTrackingChart(exName) {
  _trackingChartExercise = _trackingChartExercise === exName ? '' : exName;
  renderTrackingContent();
}

function setTrackingSubTab(tab) {
  _trackingSubTab = tab;
  renderTrackingContent();
}

function renderTracking() {
  const sel = document.getElementById('tracking-client-sel');
  if (sel) {
    const selVal = sel.value || _trackingClientId;
    sel.innerHTML = '<option value="">— בחר מתאמן —</option>' + clientOptions(selVal);
    if (selVal !== _trackingClientId) { _trackingSessionIdx = -1; _trackingChartExercise = ''; _trackingSubTab = 'sessions'; }
    _trackingClientId = selVal;
  }
  renderTrackingContent();
}

function renderTrackingContent() {
  const container = document.getElementById('tracking-content');
  if (!_trackingClientId) { container.innerHTML = '<div class="empty">בחר מתאמן כדי לראות מעקב.</div>'; return; }

  const sessions = load('sessions')
    .filter(s => s.clientId === _trackingClientId && s.log && s.log.length)
    .sort((a,b) => a.date.localeCompare(b.date));
  if (!sessions.length) { container.innerHTML = '<div class="empty">אין אימונים מתועדים למתאמן זה.</div>'; return; }

  // Default to newest (last in ascending array)
  if (_trackingSessionIdx < 0 || _trackingSessionIdx >= sessions.length) _trackingSessionIdx = sessions.length - 1;

  // Sub-tab toggle
  const subTabs = `<div style="display:flex;justify-content:center;margin-bottom:16px">
    <div class="cal-view-toggle">
      <button class="cal-view-btn${_trackingSubTab==='sessions'?' active':''}" onclick="setTrackingSubTab('sessions')">אימונים</button>
      <button class="cal-view-btn${_trackingSubTab==='charts'?' active':''}" onclick="setTrackingSubTab('charts')">גרפים</button>
    </div>
  </div>`;

  if (_trackingSubTab === 'charts') {
    container.innerHTML = subTabs + renderTrackingChartsTab(sessions);
    return;
  }

  // Date pills
  const pills = sessions.map((s,i) => {
    const wName = s.planId ? getTrackingWorkoutName(s.planId, s.workoutIdx) : '';
    return `<button class="tr-date-pill${i===_trackingSessionIdx?' active':''}" onclick="selectTrackingSession(${i})">
      <div class="tr-pill-date">${fmtDate(s.date)}</div>
      ${wName?`<div class="tr-pill-name">${esc(wName)}</div>`:''}
    </button>`;
  }).join('');

  // Selected session
  const current = sessions[_trackingSessionIdx];
  const pName = current.planId ? planName(current.planId) : '';
  const wName = current.planId ? getTrackingWorkoutName(current.planId, current.workoutIdx) : '';
  const source = current.source === 'client' ? '<span class="badge" style="background:rgba(168,218,220,.15);color:var(--accent2)">עצמאי</span>' : '<span class="badge" style="background:rgba(240,192,64,.15);color:var(--gold)">עם מאמן</span>';

  const prevSession = _trackingSessionIdx > 0 ? sessions[_trackingSessionIdx - 1] : null;

  // Build exercise rows
  const exRows = current.log.map(ex => {
    if (!ex.exerciseName) return '';
    const currentMaxW = Math.max(...ex.sets.map(s => +s.weight || 0));
    const currentTotalR = ex.sets.reduce((sum,s) => sum + (+s.reps||0), 0);
    const setsHtml = ex.sets.map((s,i) => `<span class="tr-ex-set">סט${i+1}: ${s.reps||'—'}x${s.weight?s.weight+'kg':'—'}</span>`).join('');

    let prevHtml = '';
    if (prevSession) {
      const prevEx = prevSession.log.find(e => e.exerciseName === ex.exerciseName);
      if (prevEx) {
        const prevMaxW = Math.max(...prevEx.sets.map(s => +s.weight || 0));
        const prevTotalR = prevEx.sets.reduce((sum,s) => sum + (+s.reps||0), 0);
        const prevSets = prevEx.sets.map((s,i) => `${s.reps||'—'}x${s.weight?s.weight+'kg':'—'}`).join(', ');

        let deltaHtml = '';
        if (currentMaxW > 0 && prevMaxW > 0) {
          const diff = currentMaxW - prevMaxW;
          if (diff > 0) deltaHtml = `<span class="tr-delta tr-delta-up">+${diff}kg ↑</span>`;
          else if (diff < 0) deltaHtml = `<span class="tr-delta tr-delta-down">${diff}kg ↓</span>`;
          else deltaHtml = `<span class="tr-delta tr-delta-same">ללא שינוי</span>`;
        }
        if (!deltaHtml && currentTotalR > 0 && prevTotalR > 0) {
          const diff = currentTotalR - prevTotalR;
          if (diff > 0) deltaHtml = `<span class="tr-delta tr-delta-up">+${diff} חזרות ↑</span>`;
          else if (diff < 0) deltaHtml = `<span class="tr-delta tr-delta-down">${diff} חזרות ↓</span>`;
          else deltaHtml = `<span class="tr-delta tr-delta-same">ללא שינוי</span>`;
        }

        prevHtml = `<div class="tr-ex-prev">
          <span>קודם (${fmtDate(prevSession.date)}): ${prevSets}</span>
          ${deltaHtml}
        </div>`;
      } else {
        prevHtml = '<div class="tr-ex-prev"><span>תרגיל חדש באימון זה</span></div>';
      }
    }

    const isChartOpen = _trackingChartExercise === ex.exerciseName;
    let chartHtml = '';
    if (isChartOpen) {
      chartHtml = renderExerciseChart(ex.exerciseName, sessions);
    }

    return `<div class="tr-ex-row">
      <div class="tr-ex-name" onclick="toggleTrackingChart('${esc(ex.exerciseName).replace(/'/g,"\\'")}')">
        ${ex.videoUrl?`<a href="${esc(ex.videoUrl)}" target="_blank" onclick="event.stopPropagation()">${esc(ex.exerciseName)}</a>`:esc(ex.exerciseName)}
        ${ex.category?` <span class="badge badge-cat">${esc(ex.category)}</span>`:''}
        <span style="font-size:.72rem;color:var(--muted);margin-right:6px">${isChartOpen?'▲ הסתר גרף':'▼ גרף'}</span>
      </div>
      <div class="tr-ex-sets">${setsHtml}</div>
      ${prevHtml}
      ${chartHtml}
    </div>`;
  }).join('');

  container.innerHTML = `${subTabs}
    <div class="tr-date-pills">${pills}</div>
    <div class="tr-session-header">
      <div>
        <div class="tr-session-title">${pName?esc(pName)+' · ':''}${wName?esc(wName)+' · ':''}${fmtDate(current.date)}</div>
        <div class="tr-session-meta">${current.time?esc(current.time)+' · ':''}${current.log.length} תרגילים</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        ${source}
        <button class="btn btn-sm btn-log" onclick="openWorkoutLog('${current.id}')">✏️ ערוך</button>
        <button class="btn btn-sm btn-danger" onclick="deleteTrackingSession('${current.id}')">🗑 מחק</button>
      </div>
    </div>
    ${exRows}`;
}

function renderTrackingChartsTab(sessions) {
  const allExNames = [];
  sessions.forEach(s => {
    s.log.forEach(ex => {
      if (ex.exerciseName && !allExNames.includes(ex.exerciseName)) allExNames.push(ex.exerciseName);
    });
  });
  if (!allExNames.length) return '<div class="empty">אין תרגילים מתועדים.</div>';
  if (!_trackingChartSelectedEx || !allExNames.includes(_trackingChartSelectedEx)) _trackingChartSelectedEx = allExNames[0];

  const options = allExNames.map(name =>
    `<option value="${esc(name)}"${name===_trackingChartSelectedEx?' selected':''}>${esc(name)}</option>`
  ).join('');

  const dropdown = `<div class="form-group" style="margin-bottom:16px;max-width:400px">
    <label>בחר תרגיל</label>
    <select onchange="_trackingChartSelectedEx=this.value;renderTrackingContent()">${options}</select>
  </div>`;

  // Mode toggle
  const modeToggle = `<div style="display:flex;gap:0;border:2px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:16px;width:fit-content">
    <button style="background:${_trackingChartMode==='weight'?'var(--gold)':'none'};border:none;color:${_trackingChartMode==='weight'?'#fff':'var(--muted)'};padding:6px 16px;cursor:pointer;font-size:.82rem;font-family:inherit" onclick="_trackingChartMode='weight';renderTrackingContent()">לפי משקל</button>
    <button style="background:${_trackingChartMode==='reps'?'var(--gold)':'none'};border:none;color:${_trackingChartMode==='reps'?'#fff':'var(--muted)'};padding:6px 16px;cursor:pointer;font-size:.82rem;font-family:inherit" onclick="_trackingChartMode='reps';renderTrackingContent()">לפי חזרות</button>
  </div>`;

  const chartHtml = renderExerciseChart(_trackingChartSelectedEx, sessions);

  // History table
  const data = [];
  sessions.forEach(s => {
    const ex = s.log.find(e => e.exerciseName === _trackingChartSelectedEx);
    if (ex) data.push({ date: s.date, sets: ex.sets });
  });

  const tableRows = data.map(e => {
    const setsStr = e.sets.map((s,i) => `${s.reps||'—'}x${s.weight?s.weight+'kg':'—'}`).join(' | ');
    const maxWeight = Math.max(...e.sets.map(s => +s.weight || 0));
    const totalReps = e.sets.reduce((sum,s) => sum + (+s.reps||0), 0);
    return `<tr><td>${fmtDate(e.date)}</td><td>${e.sets.length}</td><td>${setsStr}</td><td>${maxWeight||'—'}</td><td>${totalReps}</td></tr>`;
  }).join('');

  const thStyle = 'text-align:center;padding:6px 8px;color:var(--muted);border-bottom:1px solid var(--border)';
  const table = data.length ? `<div class="tr-ex-row" style="margin-top:16px">
    <table style="width:100%;border-collapse:collapse;font-size:.82rem">
      <thead><tr><th style="${thStyle}">תאריך</th><th style="${thStyle}">סטים</th><th style="${thStyle}">חזרות×משקל (kg)</th><th style="${thStyle}">משקל מקס׳</th><th style="${thStyle}">סה״כ חזרות</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
  </div>` : '';

  return `${dropdown}${modeToggle}${chartHtml}${table}`;
}

function getTrackingWorkoutName(planId, workoutIdx) {
  const plan = load('plans').find(p=>p.id===planId);
  if (!plan) return '';
  const workouts = getPlanWorkouts(plan);
  return (workouts[workoutIdx||0]||{}).name || '';
}

function renderExerciseChart(exName, sessions) {
  const data = [];
  sessions.forEach(s => {
    const ex = s.log.find(e => e.exerciseName === exName);
    if (ex) data.push({ date: s.date, sets: ex.sets || [] });
  });
  if (data.length < 1) return '<div style="color:var(--muted);font-size:.78rem;text-align:center;padding:8px">אין אימונים מתועדים לתרגיל זה</div>';

  const mode = _trackingChartMode; // 'weight' | 'reps'
  const yLabel = mode === 'weight' ? 'משקל (kg)' : 'חזרות';
  const barColor = mode === 'weight' ? 'var(--gold)' : 'var(--accent2)';

  // Calculate dimensions
  const maxSets = Math.max(...data.map(d => d.sets.length));
  const w = Math.max(600, data.length * (maxSets * 32 + 40));
  const h = 220, padTop = 20, padBottom = 50, padLeft = 50, padRight = 20;
  const chartW = w - padLeft - padRight;
  const chartH = h - padTop - padBottom;

  // Find max Y value
  let maxY = 0;
  data.forEach(d => d.sets.forEach(s => {
    const val = mode === 'weight' ? (+s.weight || 0) : (+s.reps || 0);
    if (val > maxY) maxY = val;
  }));
  if (maxY === 0) maxY = 1;
  maxY = Math.ceil(maxY * 1.15); // 15% headroom

  // Group width per session
  const groupW = chartW / data.length;
  const barGap = 3;
  const barW = Math.min(28, Math.max(14, (groupW - 20) / maxSets - barGap));

  let bars = '', labels = '', gridLines = '';

  // Y-axis grid lines (continuous)
  const yStep = maxY <= 30 ? 1 : maxY <= 60 ? 2 : maxY <= 100 ? 5 : 10;
  for (let val = 0; val <= maxY; val += yStep) {
    const y = padTop + chartH - (val / maxY) * chartH;
    gridLines += `<line x1="${padLeft}" y1="${y}" x2="${w-padRight}" y2="${y}" stroke="var(--border)" stroke-width="0.5"/>`;
    gridLines += `<text x="${padLeft-14}" y="${y+4}" text-anchor="end" fill="var(--muted)" font-size="9">${val}</text>`;
  }

  data.forEach((d, gi) => {
    const groupX = padLeft + gi * groupW;
    const groupCenter = groupX + groupW / 2;
    const totalBarsW = d.sets.length * barW + (d.sets.length - 1) * barGap;
    const startX = groupCenter - totalBarsW / 2;

    d.sets.forEach((s, si) => {
      const yVal = mode === 'weight' ? (+s.weight || 0) : (+s.reps || 0);
      const insideVal = mode === 'weight' ? (s.reps || '') : (s.weight ? s.weight + '' : '');
      const barH = (yVal / maxY) * chartH;
      const x = startX + si * (barW + barGap);
      const y = padTop + chartH - barH;

      bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" rx="3" fill="${barColor}" opacity="0.85"/>`;
      // Inside label
      if (insideVal && barH > 16) {
        bars += `<text x="${x + barW/2}" y="${y + barH/2 + 4}" text-anchor="middle" fill="#fff" font-size="8" font-weight="600">${insideVal}</text>`;
      }
    });

    // Date label
    labels += `<text x="${groupCenter}" y="${h - 8}" text-anchor="middle" fill="var(--text)" font-size="9">${fmtDate(d.date)}</text>`;
  });

  // Y-axis label
  const yAxisLabel = `<text x="12" y="${padTop + chartH/2}" text-anchor="middle" fill="var(--muted)" font-size="9" transform="rotate(-90,12,${padTop + chartH/2})">${yLabel}</text>`;

  // Legend
  const legendText = mode === 'weight' ? 'מספר בתוך העמודה = חזרות' : 'מספר בתוך העמודה = משקל (kg)';

  const svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;min-height:200px">
    ${gridLines}
    <line x1="${padLeft}" y1="${padTop}" x2="${padLeft}" y2="${padTop+chartH}" stroke="var(--border)" stroke-width="1"/>
    <line x1="${padLeft}" y1="${padTop+chartH}" x2="${w-padRight}" y2="${padTop+chartH}" stroke="var(--border)" stroke-width="1"/>
    ${bars}${labels}${yAxisLabel}
  </svg>`;

  return `<div class="tr-chart-card">
    <div class="tr-chart-title">התקדמות: ${esc(exName)}</div>
    <div style="overflow-x:auto">${svg}</div>
    <div style="text-align:center;font-size:.72rem;color:var(--muted);margin-top:6px">${legendText}</div>
  </div>`;
}

  if (_payDetail.active && _payDetailRenderer==='products') content = `<div style="margin-bottom:12px"><button class="btn btn-ghost btn-sm" onclick="closePayDetail()">&#8592; חזרה</button></div>${_payDetail.type==='punch_card'?renderPayDetailPunchCard(_payDetail.id):renderPayDetailPlan(_payDetail.id)}`;
  else if (_productsTab==='punch_card') content = renderPayTabPunchCards();
  else if (_productsTab==='plan') content = renderPayTabPlans();
  else if (_productsTab==='training') content = renderPayTabTraining();
  document.getElementById('products-tab-content').innerHTML = content;
}

function renderPayments() {
  // Quick summary bar
  const _qs = document.getElementById('pay-quick-summary');
  if (_qs) {
    const _allPay = load('payments').filter(p=>p.status==='paid');
    const _d = new Date(), _ms = `${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}`;
    const _mi = _allPay.filter(p=>p.date.startsWith(_ms)).reduce((s,p)=>s+(+p.amount||0),0);
    const _sess=load('sessions'),_plans=load('plans'),_pcs=load('punchCards'),_pays=load('payments');
    const _td = load('clients').reduce((sum,c)=>{
      const sd=_sess.filter(s=>s.clientId===c.id&&s.type==='training'&&s.status!=='cancelled'&&!s.punchCardId&&s.source!=='client').reduce((s,x)=>s+(+x.price||0),0);
      const pd=_plans.filter(p=>p.clientId===c.id&&!p.isTemplate&&p.price).reduce((s,p)=>s+(+p.price||0),0);
      const pcd=_pcs.filter(pc=>pc.ownerClientId===c.id).reduce((s,pc)=>s+(+pc.price||0),0);
      const paid=_pays.filter(p=>p.clientId===c.id&&p.status==='paid').reduce((s,p)=>s+(+p.amount||0),0);
      const debt=sd+pd+pcd-paid; return sum+(debt>0?debt:0);
    },0);
    _qs.innerHTML = `<div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:stretch">
      <div class="card" style="flex:1;min-width:130px;text-align:center;padding:12px 16px">
        <div class="card-title">הכנסות החודש</div>
        <div class="card-value" style="color:#4caf50;font-size:1.6rem">₪${_mi.toLocaleString()}</div>
      </div>
      <div class="card" style="flex:1;min-width:130px;text-align:center;padding:12px 16px">
        <div class="card-title">חובות פתוחים</div>
        <div class="card-value" style="color:var(--accent);font-size:1.6rem">₪${_td.toLocaleString()}</div>
      </div>
    </div>`;
  }
  document.getElementById('pay-tab-content').innerHTML =
    (_payDetail.active && _payDetailRenderer === 'payments') ? renderPayDetailView() : renderPayTabSummary();
}

function renderPayTabSummary() {
  const payments = load('payments'), clients = load('clients'), punchCards = load('punchCards'), plans = load('plans');

  const modeToggle = `<div style="display:flex;gap:0;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-bottom:20px;width:fit-content">
    <button type="button" onclick="_paySummaryMode='income';renderPayments()" style="padding:9px 24px;border:none;cursor:pointer;font-family:inherit;font-size:.95rem;${_paySummaryMode==='income'?'background:var(--gold);color:#fff;font-weight:600':'background:var(--card);color:var(--muted)'}">הכנסות</button>
    <button type="button" onclick="_paySummaryMode='debts';renderPayments()" style="padding:9px 24px;border:none;cursor:pointer;font-family:inherit;font-size:.95rem;${_paySummaryMode==='debts'?'background:var(--gold);color:#fff;font-weight:600':'background:var(--card);color:var(--muted)'}">חובות</button>
  </div>`;

  if (_paySummaryMode === 'income') {
    const nowD = new Date();
    const inputStyle = `background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 12px;font-size:.9rem;font-family:inherit;width:100%;height:38px;box-sizing:border-box`;
    const lblStyle = `font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px`;
    // Month dropdown — all months with payments + current month
    const allPaidDates = payments.filter(p=>p.status==='paid').map(p=>(p.date||'').slice(0,7)).filter(Boolean);
    const monthSet = new Set([_paySummaryMonth, ...allPaidDates]);
    const monthsSorted = [...monthSet].filter(Boolean).sort((a,b)=>b.localeCompare(a));
    const monthOpts = monthsSorted.map(ym=>{
      const [y,m] = ym.split('-');
      const label = new Date(+y, +m-1, 1).toLocaleDateString('he-IL',{month:'long',year:'numeric'});
      return `<option value="${ym}"${ym===_paySummaryMonth?' selected':''}>${label}</option>`;
    }).join('');
    // Apply filters
    const q = (_paySummaryClientQ||'').trim().toLowerCase();
    let filtered = payments.filter(p=>p.status==='paid');
    if (_paySummaryMonth) filtered=filtered.filter(p=>(p.date||'').startsWith(_paySummaryMonth));
    if (q) filtered=filtered.filter(p=>(clientName(p.clientId)||'').toLowerCase().includes(q));
    filtered.sort((a,b)=>a.date<b.date?1:-1);
    const total = filtered.reduce((s,p)=>s+(+p.amount||0),0);
    // Dynamic title
    const clientLabel = q ? `"${_paySummaryClientQ}"` : 'כל הלקוחות';
    const monthLabel = _paySummaryMonth
      ? new Date(+_paySummaryMonth.split('-')[0], +_paySummaryMonth.split('-')[1]-1, 1).toLocaleDateString('he-IL',{month:'long'})
      : 'כל הזמנים';
    const tableTitle = `${clientLabel}, ${_paySummaryMonth?'חודש ':''}${monthLabel}`;
    const rows = filtered.length ? filtered.map(p=>`<tr>
      <td>${fmtDate(p.date)}</td>
      <td>${p.clientId?`<a href="#" onclick="event.preventDefault();switchTab('clients');openClientProfile('${p.clientId}')" style="color:var(--accent2);text-decoration:none">${esc(clientName(p.clientId))}</a>`:'—'}</td>
      <td style="color:#4caf50;font-weight:600">₪${(+p.amount||0).toLocaleString()}</td>
      <td style="font-size:.85rem;color:var(--accent2)">${fmtPayMethod(p)}</td>
      <td style="color:var(--muted);font-size:.85rem">${esc(p.notes||'—')}</td>
      <td class="actions" style="text-align:left">
        <button class="btn btn-ghost btn-sm" onclick="openEditPayment('${p.id}')">עריכה</button>
        <button class="btn btn-danger btn-sm" onclick="deletePayment('${p.id}')">מחק</button>
      </td>
    </tr>`).join('') : `<tr><td colspan="6" style="text-align:center;color:var(--muted)">אין תשלומים בתקופה זו</td></tr>`;
    const footerRow = filtered.length ? `<tr style="font-weight:700;background:rgba(255,255,255,.04);border-top:2px solid var(--border)">
      <td colspan="2" style="color:var(--muted);font-size:.85rem">${filtered.length} תשלומים</td>
      <td style="color:#4caf50">₪${total.toLocaleString()}</td>
      <td colspan="3"></td>
    </tr>` : '';
    return `${modeToggle}
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px">
        <div style="flex:1;min-width:200px">
          <label style="${lblStyle}">חיפוש לקוח</label>
          <input id="pay-client-search" type="text" value="${esc(_paySummaryClientQ)}" placeholder="הקלד שם לקוח..." oninput="filterIncomeRows()" style="${inputStyle}">
        </div>
        <div style="flex:1;min-width:180px">
          <label style="${lblStyle}">חודש</label>
          <select onchange="_paySummaryMonth=this.value;renderPayments()" style="${inputStyle}">
            ${monthOpts}
            <option value=""${!_paySummaryMonth?' selected':''}>מכל הזמנים</option>
          </select>
        </div>
        <div style="display:flex;flex-direction:column;justify-content:flex-end">
          <label style="${lblStyle}">&nbsp;</label>
          <button class="btn" onclick="openAddPayment()" style="height:38px;white-space:nowrap">+ תשלום</button>
        </div>
      </div>
      <div style="font-size:1rem;font-weight:600;color:var(--accent2);margin-bottom:10px" id="pay-table-title">${esc(tableTitle)}</div>
      <div class="card" id="pay-income-results"><div class="table-wrap"><table>
        <thead><tr><th>תאריך</th><th>לקוח</th><th>סכום</th><th>אמצעי תשלום</th><th>הערות</th><th style="text-align:left">פעולות</th></tr></thead>
        <tbody id="pay-income-tbody">${rows}</tbody>
        ${footerRow?`<tfoot>${footerRow}</tfoot>`:''}
      </table></div></div>`;
  }

  // Debts mode — per client total debt
  const debtRows = clients.map(c=>{
    const sessDebt = load('sessions').filter(s=>s.clientId===c.id&&s.type==='training'&&s.status!=='cancelled'&&!s.punchCardId&&s.source!=='client').reduce((s,sess)=>s+(+sess.price||0),0);
    const planDebt = plans.filter(p=>p.clientId===c.id&&!p.isTemplate&&p.price).reduce((s,p)=>s+(+p.price||0),0);
    const ownedCards = punchCards.filter(pc=>pc.ownerClientId===c.id);
    const pcDebt = ownedCards.reduce((s,pc)=>s+(+pc.price||0),0);
    const totalDebt = sessDebt + planDebt + pcDebt;
    const totalPaid = payments.filter(p=>p.clientId===c.id&&p.status==='paid').reduce((s,p)=>s+(+p.amount||0),0);
    const debt = totalDebt - totalPaid;
    return debt > 0 ? {name:c.name, id:c.id, debt} : null;
  }).filter(Boolean).sort((a,b)=>b.debt-a.debt);

  return `${modeToggle}
    ${debtRows.length ? `<div class="card"><div class="table-wrap"><table>
      <thead><tr><th>לקוח</th><th>חוב</th><th></th></tr></thead>
      <tbody>${debtRows.map(x=>`<tr>
        <td><strong><a href="#" onclick="event.preventDefault();switchTab('clients');openClientProfile('${x.id}')" style="color:var(--accent2);text-decoration:none">${esc(x.name)}</a></strong></td>
        <td style="color:var(--accent);font-weight:700">₪${x.debt.toLocaleString()}</td>
        <td class="actions"><button class="btn btn-ghost btn-sm" onclick="openPayDetail('debt_client','${x.id}','payments')">פירוט</button></td>
      </tr>`).join('')}</tbody>
    </table></div></div>` : '<div class="empty">אין חובות פתוחים 🎉</div>'}`;
}

function renderPayTabTraining() {
  const allSessions = load('sessions');
  const { clientId, fromDate, toDate } = _payTrainingFilter;

  // Client filter options (all clients who have any training sessions)
  const clientsWithSess = [...new Set(allSessions.filter(s=>s.type==='training').map(s=>s.clientId))];
  const allClients = load('clients').filter(c=>clientsWithSess.includes(c.id));
  const clientOpts = `<option value="">כל הלקוחות</option>`+allClients.map(c=>`<option value="${c.id}"${c.id===clientId?' selected':''}>${esc(c.name)}</option>`).join('');

  // Filter sessions by date range
  let sessInRange = allSessions.filter(s=>s.type==='training'&&s.status!=='cancelled'&&s.source!=='client');
  if (fromDate) sessInRange = sessInRange.filter(s=>s.date>=fromDate);
  if (toDate) sessInRange = sessInRange.filter(s=>s.date<=toDate);
  if (clientId) sessInRange = sessInRange.filter(s=>s.clientId===clientId);
  sessInRange.sort((a,b)=>a.date<b.date?1:-1);

  // Summary stats
  const today = localDateStr();
  const totalCount = sessInRange.length;
  const totalCharged = sessInRange.filter(s=>!s.punchCardId&&s.date<=today).reduce((s,x)=>s+(+x.price||0),0);
  const punchCount = sessInRange.filter(s=>s.punchCardId).length;

  // Session rows
  const sessRows = sessInRange.map(s=>{
    const isPast = s.date <= today;
    let costCol;
    if (s.punchCardId) {
      const pc = load('punchCards').find(x=>x.id===s.punchCardId);
      costCol = `<span style="color:var(--accent2);font-size:.85rem">🎟 ${esc(pc?.name||clientName(pc?.ownerClientId)||'כרטיסייה')}</span>`;
    } else if (s.price) {
      costCol = `<span style="color:#4caf50;font-weight:600">₪${(+s.price).toLocaleString()}</span>`;
    } else {
      costCol = `<span style="color:var(--muted)">—</span>`;
    }
    return `<tr${!isPast?' style="opacity:.65"':''}>
      <td>${fmtDate(s.date)}</td>
      <td style="font-size:.82rem;color:var(--muted)">${esc(s.time||'')}</td>
      <td><a href="#" onclick="event.preventDefault();switchTab('clients');openClientProfile('${s.clientId}')" style="color:var(--accent2);text-decoration:none">${esc(clientName(s.clientId))}</a></td>
      <td>${costCol}</td>
    </tr>`;
  });

  return `
    <div class="pay-summary" style="margin-bottom:20px">
      <div class="card"><div class="card-title">סה"כ אימונים</div><div style="font-size:1.4rem;font-weight:700">${totalCount}</div></div>
      <div class="card"><div class="card-title">סה"כ חויב</div><div style="font-size:1.4rem;font-weight:700;color:#4caf50">${totalCharged?`₪${totalCharged.toLocaleString()}`:'—'}</div></div>
      <div class="card"><div class="card-title">ניקבו מכרטיסייה</div><div style="font-size:1.4rem;font-weight:700;color:var(--accent2)">${punchCount}</div></div>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px">
      <div class="form-group" style="margin:0;min-width:160px">
        <label style="font-size:.8rem;color:var(--muted)">לקוח</label>
        <select onchange="_payTrainingFilter.clientId=this.value;renderProducts()">${clientOpts}</select>
      </div>
      <div class="form-group" style="margin:0">
        <label style="font-size:.8rem;color:var(--muted)">מתאריך</label>
        <input type="date" value="${fromDate}" onchange="_payTrainingFilter.fromDate=this.value;renderProducts()" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 12px;font-size:.9rem;font-family:inherit">
      </div>
      <div class="form-group" style="margin:0">
        <label style="font-size:.8rem;color:var(--muted)">עד תאריך</label>
        <input type="date" value="${toDate}" onchange="_payTrainingFilter.toDate=this.value;renderProducts()" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 12px;font-size:.9rem;font-family:inherit">
      </div>
    </div>
    <div class="card">
      ${sessRows.length?`<div class="table-wrap"><table>
        <thead><tr><th>תאריך</th><th>שעה</th><th>לקוח</th><th>עלות / כרטיסייה</th></tr></thead>
        <tbody>${sessRows.join('')}</tbody>
      </table></div>`:'<div class="empty">אין אימונים בתקופה זו.</div>'}
    </div>`;
}

function punchCardRows(q) {
  const punchCards = load('punchCards');
  let cards = punchCards.map(pc=>{
    const used=punchCardSessionsUsed(pc.id).length, booked=punchCardSessionsBooked(pc.id).length;
    const rem=pc.totalSessions-used-booked;
    return {...pc,used,booked,rem};
  });
  if (q) cards=cards.filter(pc=>(clientName(pc.ownerClientId)||'').toLowerCase().includes(q)||(pc.name||'').toLowerCase().includes(q));
  if (!cards.length) return '<div class="empty">אין כרטיסיות.</div>';
  return `<div class="table-wrap"><table>
    <thead><tr><th>בעלים</th><th>שם כרטיסייה</th><th>מספר אימונים</th><th>תאריך רכישה</th><th>נוצל</th><th>מוזמן</th><th>נשאר</th><th>מחיר</th><th></th></tr></thead>
    <tbody>${cards.map(pc=>{
      const isEmpty=pc.rem===0&&pc.booked===0;
      const remColor=isEmpty?'var(--accent)':pc.rem<=2?'var(--shift)':'#4caf50';
      const mutedStyle=isEmpty?'color:var(--muted)':'';
      const dateStr=pc.date||pc.createdAt?new Date(pc.date||pc.createdAt).toLocaleDateString('he-IL'):'—';
      return `<tr${isEmpty?' style="opacity:.6"':''}>
        <td style="${mutedStyle}"><strong><a href="#" onclick="event.preventDefault();switchTab('clients');openClientProfile('${pc.ownerClientId}')" style="color:${isEmpty?'var(--muted)':'var(--accent2)'};text-decoration:none">${esc(clientName(pc.ownerClientId))}</a></strong></td>
        <td style="font-size:.85rem;${mutedStyle}">${esc(pc.name||'—')}</td>
        <td style="text-align:center;${mutedStyle}">${pc.totalSessions}</td>
        <td style="font-size:.85rem;color:var(--muted)">${dateStr}</td>
        <td style="${mutedStyle}">${pc.used}</td><td style="color:${isEmpty?'var(--muted)':'var(--accent2)'}">${pc.booked}</td>
        <td style="color:${remColor};font-weight:700">${pc.rem}</td>
        <td style="${mutedStyle}">₪${(+pc.price||0).toLocaleString()}</td>
        <td class="actions">
          <button class="btn btn-ghost btn-sm" onclick="openPayDetail('punch_card','${pc.id}','products')">פרטים</button>
          <button class="btn btn-sm" onclick="openAddPunchCardPayment('${pc.id}')">+ תשלום</button>
          <button class="btn btn-ghost btn-sm" onclick="openEditPunchCard('${pc.id}')">עריכה</button>
          <button class="btn btn-danger btn-sm" onclick="deletePunchCard('${pc.id}')">מחק</button>
        </td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}
function filterPunchCards() {
  const inp = document.getElementById('punch-search');
  if (!inp) return;
  _payPunchFilter.searchQ = inp.value;
  const container = document.getElementById('punch-cards-results');

function renderPayTabPunchCards() {
  const q = (_payPunchFilter.searchQ||'').trim().toLowerCase();
  return `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px">
      <input id="punch-search" type="text" value="${esc(_payPunchFilter.searchQ||'')}" placeholder="חיפוש שם לקוח או כרטיסייה..." oninput="filterPunchCards()" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:7px 12px;font-size:.9rem;font-family:inherit;width:220px;height:38px;box-sizing:border-box">
      <button class="btn" onclick="openAddPunchCard()" style="height:38px;white-space:nowrap">+ כרטיסייה</button>
    </div>
    <div class="card" id="punch-cards-results">${punchCardRows(q)}</div>`;

function planRows(q, filterClientId=null) {
  let plans = load('plans').filter(p=>!p.isTemplate&&p.clientId);
  if (filterClientId) plans = plans.filter(p=>p.clientId===filterClientId);
  if (q) plans = plans.filter(p=>(p.name||'').toLowerCase().includes(q)||(clientName(p.clientId)||'').toLowerCase().includes(q));
  if (!plans.length) return '<div class="empty" style="padding:16px">אין תוכניות.</div>';
  const sorted = [...plans].sort((a,b)=>(a.createdAt||0)<(b.createdAt||0)?1:-1);
  const showClient = !filterClientId;
  const deleteFn = filterClientId ? 'deletePlanFromProfile' : 'deletePlanFromProducts';
  return `<div class="table-wrap"><table>
    <thead><tr>${showClient?'<th>לקוח</th>':''}<th>שם תוכנית</th><th>תאריך</th><th>מחיר (₪)</th><th>הערות</th><th></th></tr></thead>
    <tbody>${sorted.map(p=>{
      const dateStr = p.createdAt ? new Date(p.createdAt).toLocaleDateString('he-IL') : '—';
      return `<tr>
        ${showClient?`<td><strong><a href="#" onclick="event.preventDefault();switchTab('clients');openClientProfile('${p.clientId}')" style="color:var(--accent2);text-decoration:none">${esc(clientName(p.clientId))}</a></strong></td>`:''}
        <td>${esc(p.name||'—')}</td>
        <td style="font-size:.85rem;color:var(--muted)">${dateStr}</td>
        <td>${p.price?`₪${(+p.price).toLocaleString()}`:'<span style="color:var(--muted)">—</span>'}</td>
        <td style="font-size:.85rem;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.notes||'—')}</td>
        <td class="actions">
          <button class="btn btn-sm" onclick="openAddPlanPayment('${p.id}')">+ תשלום</button>
          <button class="btn btn-ghost btn-sm" onclick="openEditPlanModal('${p.id}')">עריכה</button>
          <button class="btn btn-danger btn-sm" onclick="${deleteFn}('${p.id}')">מחק</button>
        </td>
      </tr>`;
    }).join('')}</tbody>
  </table></div>`;
}
function filterPlans() {
  const inp = document.getElementById('plan-search'); if (!inp) return;
  _payPlanFilter.searchQ = inp.value;
  const q = inp.value.trim().toLowerCase();
  const container = document.getElementById('plans-results');
  if (container) container.innerHTML = planRows(q);
}
function planFormHTML(p={}, lockedClientId=null) {
  const clientSel = lockedClientId
    ? `<input type="hidden" name="clientId" value="${esc(lockedClientId)}">`
    : `<div class="form-group"><label>לקוח *</label>${clientPickerHTML('clientId', p.clientId||'', 'addplan')}</div>`;
  const dateVal = p.createdAt ? new Date(+p.createdAt||p.createdAt).toISOString().split('T')[0] : localDateStr();
  return `<form id="modal-form">
    ${clientSel}
    <div class="form-group"><label>שם תוכנית *</label><input name="name" required placeholder="למשל: תוכנית חיטוב 3 חודשים" value="${esc(p.name||'')}"></div>
    <div class="form-row">
      <div class="form-group"><label>מחיר (₪)</label><input name="price" type="number" min="0" step="1" value="${esc(p.price||'')}" placeholder="0"></div>
      <div class="form-group"><label>תאריך</label><input name="date" type="date" value="${esc(dateVal)}"></div>
    </div>
    <div class="form-group"><label>הערות</label><input name="notes" placeholder="הערות אופציונלי" value="${esc(p.notes||'')}"></div>
    <div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal()">ביטול</button><button type="submit" class="btn">שמור</button></div>
  </form>`;
}
function openEditPlanModal(planId) {
  const p = load('plans').find(x=>x.id===planId);
  if (!p) return;
  openModal('עריכת תוכנית', planFormHTML(p, p.clientId), async fd => {
    p.name = fd.get('name') || p.name;
    p.price = fd.get('price') ? +fd.get('price') : '';
    p.createdAt = new Date(fd.get('date')||localDateStr()).getTime();
    p.notes = fd.get('notes')||'';
    await saveItem('plans', p);
    if (_clientProfile.active) renderClientProfile(); else renderProducts();
  });

function renderDebtClientDetail(clientId) {
  const client = load('clients').find(c=>c.id===clientId);
  if (!client) return '<div class="empty">לקוח לא נמצא</div>';
  const sessions = load('sessions').filter(s=>s.clientId===clientId&&s.type==='training'&&s.status!=='cancelled'&&!s.punchCardId&&s.source!=='client');

  const allPayments = load('payments').filter(p=>p.clientId===clientId&&p.status==='paid');
  const totalDebt = sessions.reduce((s,x)=>s+(+x.price||0),0) + plans.reduce((s,p)=>s+(+p.price||0),0) + punchCards.reduce((s,pc)=>s+(+pc.price||0),0);
  const totalPaid = allPayments.reduce((s,p)=>s+(+p.amount||0),0);
  const balance = totalPaid - totalDebt;
  const balColor = balance >= 0 ? '#4caf50' : 'var(--accent)';
  const balText = balance > 0 ? `₪${balance.toLocaleString()} זיכוי` : balance < 0 ? `₪${Math.abs(balance).toLocaleString()} חוב` : '₪0';

  // Summary boxes
  const summary = `<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">

    </div>
    <div class="card" style="flex:1;min-width:120px;text-align:center;padding:14px 10px">
      <div style="font-size:.8rem;color:var(--muted);margin-bottom:4px">סה"כ תשלומים</div>
      <div style="font-size:1.4rem;font-weight:700;color:#4caf50">₪${totalPaid.toLocaleString()}</div>
    </div>
    <div class="card" style="flex:1;min-width:120px;text-align:center;padding:14px 10px">
      <div style="font-size:.8rem;color:var(--muted);margin-bottom:4px">יתרה</div>
      <div style="font-size:1.4rem;font-weight:700;color:${balColor}">${balText}</div>
    </div>
  </div>`;

  // Products table
  const prodRows = [];
  sessions.sort((a,b)=>a.date<b.date?1:-1).forEach(s=>{
    prodRows.push(`<tr><td>${fmtDate(s.date)}</td><td>אימון${s.time?' · '+s.time:''}</td><td style="color:var(--accent);font-weight:600">₪${(+s.price||0).toLocaleString()}</td></tr>`);
  });
  plans.forEach(p=>{
    prodRows.push(`<tr><td>—</td><td>תוכנית: ${esc(p.name)}</td><td style="color:var(--accent);font-weight:600">₪${(+p.price||0).toLocaleString()}</td></tr>`);
  });
  punchCards.forEach(pc=>{
    prodRows.push(`<tr><td>${pc.date?fmtDate(pc.date):'—'}</td><td>כרטיסייה: ${esc(pc.name||'כרטיסייה')}</td><td style="color:var(--accent);font-weight:600">₪${(+pc.price||0).toLocaleString()}</td></tr>`);
  });
  const productsTable = `<div class="card" style="margin-bottom:16px">
    <div style="font-size:.9rem;font-weight:600;color:var(--gold);margin-bottom:10px">מוצרים / חובות</div>
    ${prodRows.length ? `<div class="table-wrap"><table><thead><tr><th>תאריך</th><th>פירוט</th><th>סכום</th></tr></thead><tbody>${prodRows.join('')}</tbody>
      <tfoot><tr style="font-weight:700;border-top:2px solid var(--border)"><td colspan="2" style="color:var(--muted);font-size:.85rem">סה"כ</td><td style="color:var(--accent)">₪${totalDebt.toLocaleString()}</td></tr></tfoot>
    </table></div>` : '<div style="color:var(--muted);font-size:.85rem">אין חובות</div>'}
  </div>`;

  // Payments table
  const payRows = allPayments.sort((a,b)=>a.date<b.date?1:-1).map(p=>`<tr>
    <td>${fmtDate(p.date)}</td>
    <td style="color:#4caf50;font-weight:600">₪${(+p.amount||0).toLocaleString()}</td>
    <td style="font-size:.85rem;color:var(--accent2)">${fmtPayMethod(p)}</td>

  const paymentsTable = `<div class="card">
    <div style="font-size:.9rem;font-weight:600;color:var(--gold);margin-bottom:10px">תשלומים</div>
