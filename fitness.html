<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מאמן כושר</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #1a1a2e;
      --card:    #16213e;
      --border:  #0f3460;
      --accent:  #e94560;
      --accent2: #a8dadc;
      --text:    #e0e0e0;
      --muted:   #888;
      --shift:   #ffa726;
      --gold:    #f0c040;
    }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* LOADING */
    #loading-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .loading-box { text-align: center; color: var(--accent2); }
    .spinner {
      width: 44px; height: 44px; border: 4px solid var(--border);
      border-top-color: var(--gold); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-box p { font-size: 1rem; }
    .loading-box small { color: var(--muted); font-size: .82rem; margin-top: 6px; display: block; }

    /* NAV */
    nav {
      background: #0f3460; border-bottom: 2px solid rgba(168,218,220,.2);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; height: 60px; position: sticky; top: 0; z-index: 100; gap: 12px;
    }
    nav .app-title { order: 1; }
    nav .logout-btn { order: 3; margin-right: auto; }
    nav .nav-tabs { order: 2; flex: 1; justify-content: center; }
    .app-title { color: var(--gold); font-size: 1.2rem; font-weight: bold; text-shadow: 0 0 15px rgba(240,192,64,.4); white-space: nowrap; }
    .trainer-name-gold {
      background: linear-gradient(135deg, #f0c040 0%, #fff8c0 50%, #e8a020 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: .08em;
      font-size: 1.05em;
      filter: drop-shadow(0 0 8px rgba(240,192,64,.5));
    }
    .nav-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
    .nav-tab {
      background: none; border: 2px solid transparent; color: var(--muted);
      padding: 7px 13px; border-radius: 8px; cursor: pointer; font-size: .95rem; transition: all .2s;
    }
    .nav-tab:hover { color: var(--text); border-color: var(--border); }
    .nav-tab.active { color: var(--gold); border-color: var(--gold); background: rgba(240,192,64,.1); }
    .nav-more { position: relative; }
    .nav-more-dropdown { display: none; position: absolute; top: calc(100% + 6px); left: 0; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px; z-index: 200; min-width: 140px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
    .nav-more-dropdown.open { display: block; }
    .nav-more-dropdown button { display: block; width: 100%; text-align: right; padding: 8px 14px; background: none; border: none; color: var(--text); cursor: pointer; border-radius: 6px; font-family: inherit; font-size: .9rem; }
    .nav-more-dropdown button:hover { background: rgba(255,255,255,.06); }
    .nav-more-dropdown button.active { color: var(--gold); font-weight: 600; }
    /* MOBILE BOTTOM TAB BAR */
    .mobile-tab-bar { display: none; }
    .mobile-tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 2px 8px; gap: 2px; background: none; border: none; color: var(--muted); font-size: .78rem; cursor: pointer; font-family: inherit; transition: color .2s; -webkit-tap-highlight-color: transparent; }
    .mobile-tab-btn .tab-icon { font-size: 1.6rem; line-height: 1; }
    .mobile-tab-btn.active { color: var(--gold); background: rgba(240,192,64,.1); border-top: 2px solid var(--gold); }
    .mobile-more-wrap { position: relative; flex: 1; display: flex; }
    .mobile-more-dropdown { display: none; position: absolute; bottom: calc(100% + 4px); left: 0; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 4px; z-index: 300; min-width: 150px; box-shadow: 0 -4px 20px rgba(0,0,0,.5); }
    .mobile-more-dropdown.open { display: block; }
    .mobile-more-dropdown button { display: block; width: 100%; text-align: right; padding: 10px 16px; background: none; border: none; color: var(--text); cursor: pointer; border-radius: 6px; font-family: inherit; font-size: 1rem; }
    .mobile-more-dropdown button:hover { background: rgba(255,255,255,.06); }
    .mobile-more-dropdown button.active { color: var(--gold); font-weight: 600; }

    /* PAY SUB-TABS */
    .sub-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
    .sub-tab-btn {
      background: none; border: 2px solid var(--border); color: var(--muted);
      padding: 6px 16px; border-radius: 8px; cursor: pointer; font-size: .9rem; transition: all .2s;
    }
    .sub-tab-btn:hover { color: var(--text); border-color: var(--accent2); }
    .sub-tab-btn.active { color: var(--accent2); border-color: var(--accent2); background: rgba(168,218,220,.1); }

    /* MAIN */
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    section[id^="tab-"] { display: none; }
    section[id^="tab-"].active { display: block; }

    /* CARDS */
    .card { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 18px; }
    .card-title { color: var(--accent2); font-size: 1rem; margin-bottom: 6px; text-align: center; }
    .card-value { font-size: 2rem; font-weight: bold; text-align: center; }
    .dashboard { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-bottom: 28px; }

    /* SECTION HEADER */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .section-header h2 { font-size: 1.2rem; color: var(--accent2); }
    .sub-header { font-size: 1rem; color: var(--muted); margin: 20px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

    /* BUTTONS */
    .btn {
      background: var(--gold); color: #fff; border: none; padding: 8px 20px;
      border-radius: 8px; cursor: pointer; font-size: .9rem;
      transition: background .2s, transform .1s; text-decoration: none; display: inline-block;
    }
    .btn:hover { background: #d4a832; transform: scale(1.03); }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-sm { padding: 4px 12px; font-size: .8rem; }
    .btn-ghost { background: none; border: 2px solid var(--border); color: var(--text); }
    .btn-ghost:hover { border-color: var(--gold); color: var(--gold); background: none; transform: scale(1.03); }
    .btn-danger { background: #7b1d2e; }
    .btn-danger:hover { background: #a32540; }
    .btn-teal { background: #1a5a6a; }
    .btn-teal:hover { background: #126070; }
    .wa-btn { background: #1a7a3c; }
    .wa-btn:hover { background: #145f2e; }
    .btn-log { background: #5c4b9e; }
    .btn-log:hover { background: #7b6bb5; }

    /* TABLE */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: .85rem; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.03); }
    .actions { display: flex; gap: 4px; justify-content: flex-end; flex-wrap: nowrap; white-space: nowrap; }
    @media (max-width: 640px) { .actions .btn { padding: 4px 8px; font-size: .78rem; } }

    /* BADGES */
    .badge { padding: 3px 10px; border-radius: 10px; font-size: .75rem; font-weight: 600; display: inline-block; }
    .badge-paid    { background: #1a4a2e; color: #4caf50; }
    .badge-pending { background: #4a3a1a; color: #ffa726; }
    .badge-cat  { background: rgba(168,218,220,.15); color: var(--accent2); }
    .badge-tmpl { background: rgba(240,192,64,.15); color: var(--gold); }
    .badge-shift { background: rgba(255,167,38,.15); color: var(--shift); }
    .badge-recurring { background: rgba(168,218,220,.15); color: var(--accent2); font-size: .75rem; }
    .badge-logged { background: rgba(92,75,158,.2); color: #b39ddb; }
    .badge-active  { background: #1a4a2e; color: #4caf50; }
    .badge-paused  { background: #4a3a1a; color: #ffa726; }
    .badge-stopped { background: #4a1a1a; color: #e94560; }

    /* STATUS FILTER */
    .status-filter { background: var(--bg); border: 2px solid var(--border); border-radius: 8px; color: var(--text); padding: 7px 12px; font-size: .85rem; }
    .status-filter:focus { outline: none; border-color: var(--accent2); }

    /* PAYMENT FILTERS */
    .pay-filters { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .pay-filters-title { color: var(--accent2); font-size: .9rem; margin-bottom: 12px; font-weight: 600; }
    .month-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .month-btn { background: var(--bg); border: 2px solid var(--border); color: var(--muted); padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: .8rem; transition: all .2s; }
    .month-btn:hover { border-color: var(--accent2); color: var(--text); }
    .month-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(240,192,64,.1); }
    .pay-filter-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
    .pay-filter-row .form-group { margin-bottom: 0; min-width: 140px; }

    /* EMPTY */
    .empty { text-align: center; color: var(--muted); padding: 40px; font-size: 1rem; }

    /* CALENDAR */
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .cal-nav h3 { color: var(--accent2); font-size: 1.1rem; }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 4px; margin-bottom: 24px; }
    .cal-day-name { text-align: center; font-size: .75rem; color: var(--muted); padding: 4px 0; }
    .cal-day { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 4px; min-height: 52px; text-align: center; cursor: pointer; transition: border-color .2s; }
    .cal-day:hover { border-color: var(--gold); }
    .cal-day.today { border-color: var(--accent2); }
    .cal-day.empty-day { background: none; border-color: transparent; cursor: default; }
    .cal-day-num { font-size: .85rem; color: var(--muted); }
    .cal-day.today .cal-day-num { color: var(--accent2); font-weight: bold; }
    .cal-day.selected { border-color: var(--gold); background: rgba(240,192,64,.12); }
    .cal-day.selected .cal-day-num { color: var(--gold); font-weight: bold; }
    .cal-dots { display: flex; gap: 3px; justify-content: center; margin-top: 4px; flex-wrap: wrap; }
    .cal-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .cal-dot.shift-dot { background: var(--shift); }
    .cal-dot.personal-dot { background: #1565c0; }
    .cal-dot.cancelled-dot { background: var(--muted); opacity: .5; }
    .cal-view-toggle { display: flex; gap: 0; border: 2px solid var(--border); border-radius: 8px; overflow: hidden; }
    .cal-view-btn { background: none; border: none; color: var(--muted); padding: 5px 14px; cursor: pointer; font-size: .8rem; font-family: inherit; transition: all .2s; }
    .cal-view-btn.active { background: var(--gold); color: #fff; }
    .week-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
    .week-col { background: var(--card); border: 2px solid var(--border); border-radius: 10px; padding: 8px 6px; min-height: 120px; cursor: pointer; transition: border-color .2s; }
    .week-col:hover { border-color: var(--gold); }
    .week-col.selected { border-color: var(--gold); background: rgba(240,192,64,.12); }
    .week-col.today { border-color: var(--accent2); }
    .week-col-header { text-align: center; margin-bottom: 6px; }
    .week-col-day { font-size: .75rem; color: var(--muted); }
    .week-col-num { font-size: 1rem; font-weight: 600; color: var(--text); }
    .week-col.today .week-col-num { color: var(--accent2); }
    .week-col.selected .week-col-num { color: var(--gold); }
    .week-session { font-size: .72rem; padding: 3px 4px; margin-bottom: 3px; border-radius: 4px; background: rgba(233,69,96,.1); color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .week-session.shift { background: rgba(255,167,38,.1); color: var(--shift); }
    .week-session.personal { background: #1565c0; color: #fff; }
    .week-session.cancelled { background: rgba(150,150,150,.1); color: var(--muted); text-decoration: line-through; }
    tr.cancelled-row td { opacity: .5; }
    .badge-cancelled { background: rgba(150,150,150,.2); color: var(--muted); }
    @media (max-width: 640px) { .week-grid { grid-template-columns: repeat(3,1fr); } .week-col { min-height: 80px; } }

    /* PLAN CARDS */
    .plans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px,1fr)); gap: 16px; }
    .plan-card { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 24px; max-width: 900px; margin: 0 auto; }
    .plan-card.tmpl-card { border-color: rgba(240,192,64,.4); }
    .plan-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .plan-name { font-size: 1.15rem; font-weight: bold; color: var(--accent2); }
    .plan-client { font-size: .85rem; color: var(--muted); margin-top: 4px; }
    .plan-card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); justify-content: center; }
    .plan-table { width: 100%; border-collapse: collapse; }
    .plan-table th { text-align: right; padding: 10px 14px; color: var(--muted); font-size: .82rem; font-weight: 600; border-bottom: 2px solid var(--border); }
    .plan-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: .9rem; cursor: pointer; transition: background .15s; }
    .plan-table tr:hover td { background: rgba(240,192,64,.06); }
    .plan-table .plan-client-name { color: var(--accent2); font-weight: 600; }
    .plan-table .plan-date { color: var(--muted); font-size: .82rem; }
    .pb-client-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: var(--card); border: 2px solid var(--border); border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 10; display: none; }
    .pb-client-option { padding: 8px 12px; cursor: pointer; font-size: .9rem; }
    .pb-client-option:hover { background: rgba(240,192,64,.08); }
    .ex-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .ex-table th, .ex-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: right; }
    .ex-table th { color: var(--muted); font-size: .8rem; }
    .ex-table tr:last-child td { border-bottom: none; }
    .ex-table a { color: var(--accent2); }

    /* REMINDERS */
    .reminders-list { display: flex; flex-direction: column; gap: 12px; }
    .reminder-card { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .reminder-card.today-card { border-color: var(--gold); }
    .reminder-info h3 { font-size: 1rem; margin-bottom: 4px; }
    .reminder-info p  { font-size: .85rem; color: var(--muted); }
    .reminder-tag { font-size: .75rem; background: rgba(240,192,64,.2); color: var(--gold); padding: 2px 8px; border-radius: 10px; margin-left: 8px; }

    /* PAYMENT SUMMARY */
    .pay-summary { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-bottom: 20px; }

    /* MODAL */
    #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
    #modal-overlay.open { display: flex; }
    #modal-box { background: var(--card); border: 2px solid var(--border); border-radius: 16px; padding: 28px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; position: relative; }
    #modal-title { color: var(--accent2); font-size: 1.2rem; margin-bottom: 20px; }
    #modal-close { position: absolute; top: 16px; left: 16px; background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; line-height: 1; }
    #modal-close:hover { color: var(--gold); }

    /* FORM */
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-group label { font-size: .85rem; color: var(--muted); }
    .form-group input, .form-group select, .form-group textarea { background: var(--bg); border: 2px solid var(--border); border-radius: 8px; color: var(--text); padding: 9px 12px; font-size: .9rem; font-family: inherit; width: 100%; transition: border-color .2s; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent2); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
    .form-check { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .form-check input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--gold); }
    .form-check label { font-size: .9rem; color: var(--text); cursor: pointer; }

    /* TYPE TOGGLE */
    .type-toggle { display: flex; gap: 0; margin-bottom: 16px; border-radius: 8px; overflow: hidden; border: 2px solid var(--border); }
    .type-toggle label { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-size: .9rem; transition: all .2s; background: var(--bg); color: var(--muted); }
    .type-toggle input { display: none; }
    .type-toggle input:checked + label { background: var(--accent); color: #fff; }
    .type-toggle input[value="shift"]:checked + label { background: var(--shift); color: #fff; }

    /* SHIFT CALC */
    .shift-calc { background: var(--bg); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .shift-calc-row { display: flex; justify-content: space-between; align-items: center; font-size: .9rem; margin-bottom: 6px; }
    .shift-calc-row:last-child { margin-bottom: 0; }
    .shift-calc-total { font-size: 1.1rem; font-weight: bold; color: var(--accent2); }

    /* EXERCISE BUILDER */
    #ex-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
    .ex-item { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .ex-item-top { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
    .ex-item-mid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .ex-item input, .ex-item select { background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 7px 10px; font-size: .85rem; font-family: inherit; width: 100%; }
    .ex-item input:focus, .ex-item select:focus { outline: none; border-color: var(--accent2); }
    .ex-item-bank { margin-bottom: 6px; }
    .ex-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 2px 6px; border-radius: 4px; }
    .ex-remove:hover { color: var(--gold); background: rgba(240,192,64,.1); }
    .ex-label { font-size: .75rem; color: var(--muted); margin-bottom: 2px; }
    .ex-set-row { display: grid; grid-template-columns: 40px 1fr 1fr 1fr auto; gap: 6px; align-items: center; margin-bottom: 4px; }
    .ex-set-row span { font-size: .78rem; color: var(--muted); text-align: center; }
    .ex-set-row input { font-size: .82rem; padding: 5px 8px; }
    .ex-sets-header { display: grid; grid-template-columns: 40px 1fr 1fr 1fr auto; gap: 6px; margin-bottom: 4px; }
    .ex-sets-header span { font-size: .72rem; color: var(--muted); text-align: center; }
    .ex-add-set { background: none; border: 1px dashed var(--border); color: var(--muted); padding: 4px; border-radius: 6px; cursor: pointer; font-size: .78rem; width: 100%; margin-top: 4px; }
    .ex-add-set:hover { border-color: var(--accent2); color: var(--accent2); }

    /* PLAN BUILDER - SPLIT VIEW */
    .plan-builder { display: flex; gap: 0; min-height: calc(100vh - 100px); }
    .plan-builder-left { width: 320px; min-width: 280px; background: var(--card); border-left: 2px solid var(--border); overflow-y: auto; max-height: calc(100vh - 100px); position: sticky; top: 60px; border-radius: 12px 0 0 12px; }
    .plan-builder-right { flex: 1; padding: 16px; overflow-y: auto; }
    .pb-search { width: 100%; padding: 10px 14px; background: var(--bg); border: none; border-bottom: 2px solid var(--border); color: var(--text); font-size: .85rem; font-family: inherit; }
    .pb-search:focus { outline: none; border-bottom-color: var(--accent2); }
    .pb-group-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; text-align: right; padding: 10px 16px; background: none; border: none; border-bottom: 1px solid rgba(15,52,96,.4); color: var(--text); font-size: .88rem; cursor: pointer; transition: background .2s; }
    .pb-group-btn:hover { background: rgba(240,192,64,.08); }
    .pb-group-btn.active { background: rgba(240,192,64,.12); color: var(--gold); font-weight: 600; }
    .pb-group-btn .pb-count { color: var(--muted); font-size: .75rem; }
    .pb-ex-list { padding: 0; }

    /* WORKOUT LOG */

    .log-set-row input:focus { outline: none; border-color: var(--accent2); }
    .log-set-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: .9rem; padding: 2px 4px; }
    .log-set-remove:hover { color: var(--gold); }
    .log-add-set { background: none; border: 1px dashed var(--border); color: var(--muted); padding: 6px; border-radius: 6px; cursor: pointer; font-size: .8rem; width: 100%; margin-top: 4px; transition: all .2s; }
    .log-add-set:hover { border-color: var(--accent2); color: var(--accent2); }
    .log-add-exercise { background: none; border: 2px dashed var(--border); color: var(--muted); padding: 12px; border-radius: 10px; cursor: pointer; font-size: .85rem; width: 100%; margin-bottom: 16px; transition: all .2s; text-align: center; }
    .log-add-exercise:hover { border-color: var(--accent2); color: var(--accent2); }

    /* LIVE WORKOUT */
    .live-workout { padding: 0 4px; }
    .live-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; margin-bottom: 12px; border-bottom: 2px solid var(--border); position: sticky; top: 56px; background: var(--bg); z-index: 10; }
    .live-progress { color: var(--accent2); font-size: .9rem; font-weight: 600; }
    .live-card { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
    .live-ex-name { font-size: 1.15rem; font-weight: 700; color: var(--accent2); margin-bottom: 4px; }
    .live-ex-name a { color: var(--accent2); text-decoration: none; }
    .live-ex-name a:hover { text-decoration: underline; }
    .live-prev { background: rgba(168,218,220,.08); border: 1px solid rgba(168,218,220,.2); border-radius: 10px; padding: 10px 14px; margin: 12px 0; font-size: .82rem; color: var(--muted); }
    .live-prev-title { color: var(--accent2); font-weight: 600; margin-bottom: 4px; font-size: .78rem; }

    .live-set-row input:focus { outline: none; border-color: var(--accent2); }
    .live-sets-header { display: grid; grid-template-columns: 36px 1fr 1fr 1.2fr auto; gap: 8px; margin-bottom: 6px; }
    .live-sets-header span { font-size: .72rem; color: var(--muted); text-align: center; }
    .live-nav { display: flex; gap: 12px; margin-top: 16px; }
    .live-nav button { flex: 1; padding: 14px; font-size: 1rem; min-height: 48px; }
    .live-swap-btn { background: none; border: 2px dashed var(--border); color: var(--muted); padding: 10px; border-radius: 10px; cursor: pointer; font-size: .85rem; width: 100%; margin-top: 12px; transition: all .2s; text-align: center; }
    .live-swap-btn:hover { border-color: var(--accent2); color: var(--accent2); }
    .live-swap-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 200; display: flex; justify-content: center; align-items: flex-start; padding-top: 60px; }
    .live-swap-panel { background: var(--card); border: 2px solid var(--border); border-radius: 14px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
    .live-swap-panel-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 2px solid var(--border); }

    /* CLIENT PROFILE */
    .cp-back { background: none; border: none; color: var(--accent2); cursor: pointer; font-size: .9rem; padding: 8px 0; margin-bottom: 12px; }
    .cp-back:hover { text-decoration: underline; }
    .cp-layout { display: flex; gap: 24px; }
    .cp-sidebar { width: 180px; flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 10px; align-self: flex-start; position: sticky; top: 80px; }
    .cp-sidebar-btn { text-align: right; padding: 10px 14px; background: none; border: none; border-radius: 8px; color: var(--muted); cursor: pointer; font-size: .88rem; font-family: inherit; transition: all .15s; }
    .cp-sidebar-btn:hover { color: var(--text); background: rgba(240,192,64,.06); }
    .cp-sidebar-btn.active { color: var(--gold); background: rgba(240,192,64,.1); font-weight: 600; }
    .cp-content { flex: 1; min-width: 0; }
    .cp-header { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
    .cp-name { font-size: 1.3rem; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    .cp-info { display: flex; flex-wrap: wrap; gap: 16px; color: var(--muted); font-size: .88rem; }
    .cp-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .cp-section { margin-bottom: 20px; }
    .cp-section-title { color: var(--gold); font-size: .95rem; font-weight: 600; margin-bottom: 10px; border-bottom: 1px solid var(--gold); padding-bottom: 6px; }
    @media (max-width: 640px) { .cp-layout { flex-direction: column; } .cp-sidebar { width: 100%; flex-direction: row; overflow-x: auto; position: static; } }
    .cp-plan-row { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; font-size: .88rem; }

    .cp-session-row { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 6px; cursor: pointer; transition: background .2s; font-size: .86rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
    .cp-session-row:hover { background: rgba(168,218,220,.05); }
    .cp-session-detail { background: var(--bg); border: 1px solid var(--border); border-radius: 0 0 10px 10px; padding: 12px; margin-top: -6px; margin-bottom: 6px; font-size: .82rem; }
    .cp-log-ex { margin-bottom: 8px; }
    .cp-log-ex-name { color: var(--accent2); font-weight: 600; font-size: .82rem; }
    .cp-log-sets { color: var(--muted); font-size: .78rem; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }

    /* TRACKING */
    .tr-date-pills { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; margin-bottom: 16px; -webkit-overflow-scrolling: touch; }

    .tr-date-pill { background: var(--bg); border: 2px solid var(--border); border-radius: 10px; padding: 8px 16px; cursor: pointer; white-space: nowrap; font-size: .82rem; transition: all .2s; flex-shrink: 0; text-align: center; color: var(--text); }
    .tr-date-pill:hover { border-color: var(--gold); color: var(--gold); }
    .tr-date-pill.active { border-color: var(--gold); background: rgba(240,192,64,.1); color: var(--gold); font-weight: 600; }
    .tr-date-pill .tr-pill-date { font-weight: 600; }
    .tr-date-pill .tr-pill-name { font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .tr-date-pill.active .tr-pill-name { color: var(--gold); opacity: .7; }
    .tr-session-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
    .tr-session-title { font-size: 1.1rem; font-weight: 700; color: var(--accent2); }
    .tr-session-meta { font-size: .82rem; color: var(--muted); }
    .tr-ex-row { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }
    .tr-ex-name { font-size: .95rem; font-weight: 700; color: var(--accent2); margin-bottom: 8px; cursor: pointer; }
    .tr-ex-name:hover { text-decoration: underline; }
    .tr-ex-name a { color: var(--accent2); text-decoration: none; }
    .tr-ex-name a:hover { text-decoration: underline; }
    .tr-ex-sets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .tr-ex-set { background: var(--bg); padding: 5px 12px; border-radius: 8px; font-size: .82rem; }
    .tr-ex-prev { font-size: .78rem; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .tr-delta { font-size: .78rem; font-weight: 600; padding: 2px 8px; border-radius: 6px; }
    .tr-delta-up { background: rgba(76,175,80,.15); color: #4caf50; }
    .tr-delta-down { background: rgba(233,69,96,.15); color: var(--accent); }
    .tr-delta-same { background: rgba(136,136,136,.15); color: var(--muted); }
    .tr-chart { width: 100%; height: 120px; position: relative; margin-top: 8px; }
    .tr-chart svg { width: 100%; height: 100%; }
    .tr-legend { display: flex; gap: 16px; justify-content: center; font-size: .72rem; color: var(--muted); margin-top: 4px; }
    .tr-chart-card { background: var(--card); border: 2px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 16px; }
    .tr-chart-title { font-size: .9rem; font-weight: 600; color: var(--accent2); margin-bottom: 8px; }

    /* DAY POPUP */
    .day-session-item { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

    /* LOGIN */
    #login-screen {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .login-box {
      background: var(--card); border: 2px solid var(--border); border-radius: 16px;
      padding: 40px 32px; width: 100%; max-width: 360px; text-align: center;
    }
    .login-box h1 { color: var(--gold); font-size: 1.6rem; margin-bottom: 8px; }
    .login-box p { color: var(--muted); font-size: .9rem; margin-bottom: 24px; }
    .login-box input {
      width: 100%; background: var(--bg); border: 2px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 12px 14px; font-size: 1rem; font-family: inherit;

    @media (max-width: 640px) {

      main { padding: 14px; padding-bottom: 80px; }

      .dashboard .card-value { font-size: 1.6rem; }
      .pay-summary { grid-template-columns: 1fr; }
      .form-row, .form-row-3 { grid-template-columns: 1fr; }

      .log-set-row input.log-notes-input { display: none; }
      #client-search { width: 110px; }
    }
  </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <h1>מאמן כושר 💪</h1>
    <p id="login-subtitle">הזן מספר טלפון וסיסמה</p>
    <!-- Login form -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <input type="tel" id="login-phone" placeholder="מספר טלפון" dir="ltr" autocomplete="tel">
      <input type="password" id="login-pin" placeholder="סיסמה (4 ספרות)" maxlength="4" inputmode="numeric" autocomplete="current-password" dir="ltr">
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="btn" style="width:100%">כניסה</button>
    </form>
    <!-- First-time setup (shown only if no trainer exists) -->
    <form id="setup-form" style="display:none;margin-top:16px" onsubmit="handleSetup(event)">
      <input type="text" id="setup-name" placeholder="שם מלא">
      <input type="tel" id="setup-phone" placeholder="מספר טלפון" dir="ltr">
      <input type="password" id="setup-pin" placeholder="בחר סיסמה (4 ספרות)" maxlength="4" inputmode="numeric" dir="ltr">
      <input type="password" id="setup-pin-confirm" placeholder="אימות סיסמה" maxlength="4" inputmode="numeric" dir="ltr">
      <div class="login-error" id="setup-error"></div>
      <button type="submit" class="btn" style="width:100%;background:var(--accent2)">צור חשבון</button>
    </form>
    <!-- First login - set password -->
    <form id="set-pin-form" style="display:none;margin-top:16px" onsubmit="handleSetPin(event)">
      <p style="font-size:.9rem;margin-bottom:12px;color:var(--text)">כניסה ראשונה — בחר סיסמה</p>
      <input type="password" id="set-pin-new" placeholder="בחר סיסמה (4 ספרות)" maxlength="4" inputmode="numeric" dir="ltr">
      <input type="password" id="set-pin-confirm2" placeholder="אימות סיסמה" maxlength="4" inputmode="numeric" dir="ltr">
      <div class="login-error" id="set-pin-error"></div>
      <button type="submit" class="btn" style="width:100%;background:var(--accent2)">שמור סיסמה והיכנס</button>
    </form>
  </div>
</div>

<!-- LOADING -->
<div id="loading-overlay" style="display:none">
  <div class="loading-box">
    <div class="spinner"></div>
    <p>מתחבר למסד הנתונים...</p>
    <small>Firebase Firestore</small>
  </div>
</div>

<nav>
  <div class="app-title"><span id="nav-trainer-name">מאמן כושר</span> 💪</div>
  <button class="logout-btn" onclick="handleLogout()">התנתק</button>
  <div class="nav-tabs">
    <button class="nav-tab" data-tab="schedule">יומן</button>
    <button class="nav-tab" data-tab="payments">תשלומים</button>
    <button class="nav-tab" data-tab="products">מוצרים</button>
    <button class="nav-tab" data-tab="clients">לקוחות</button>
    <div class="nav-more" id="nav-more-wrap">
      <button class="nav-tab" id="nav-more-btn" onclick="toggleNavMore(event)">אחר ▾</button>
      <div class="nav-more-dropdown" id="nav-more-dropdown">
        <button data-tab="exercises" onclick="switchTabMore('exercises')">בנק תרגילים</button>
        <button data-tab="workouts" onclick="switchTabMore('workouts')">תוכניות אימון</button>
        <button data-tab="reminders" onclick="switchTabMore('reminders')">תזכורות</button>
        <button data-tab="admin" id="nav-admin-tab" style="display:none" onclick="switchTabMore('admin')">ניהול</button>
      </div>
    </div>
  </div>
</nav>

<!-- MOBILE BOTTOM TAB BAR -->
<div class="mobile-tab-bar" id="mobile-tab-bar">
  <button class="mobile-tab-btn" data-tab="schedule" onclick="switchTab('schedule')">
    <span class="tab-icon">🗓</span><span>יומן</span>
  </button>
  <button class="mobile-tab-btn" data-tab="payments" onclick="switchTab('payments')">
    <span class="tab-icon">💳</span><span>תשלומים</span>
  </button>
  <button class="mobile-tab-btn" data-tab="products" onclick="switchTab('products')">
    <span class="tab-icon">📦</span><span>מוצרים</span>
  </button>
  <button class="mobile-tab-btn" data-tab="clients" onclick="switchTab('clients')">
    <span class="tab-icon">👥</span><span>לקוחות</span>
  </button>
  <div class="mobile-more-wrap">
    <button class="mobile-tab-btn" id="mobile-more-btn" onclick="toggleMobileMore(event)" style="width:100%">
      <span class="tab-icon">☰</span><span>אחר</span>
    </button>
    <div class="mobile-more-dropdown" id="mobile-more-dropdown">
      <button data-tab="exercises" onclick="switchTabMobile('exercises')">🏋️ בנק תרגילים</button>
      <button data-tab="workouts" onclick="switchTabMobile('workouts')">📋 תוכניות אימון</button>
      <button data-tab="reminders" onclick="switchTabMobile('reminders')">🔔 תזכורות</button>
      <button data-tab="admin" id="mobile-admin-tab" style="display:none" onclick="switchTabMobile('admin')">⚙️ ניהול</button>
    </div>
  </div>
</div>

<main>
  <section id="tab-clients">
    <div class="dashboard" id="dashboard"></div>

const firebaseConfig = {

// ===== IN-MEMORY CACHE =====
const cache = { clients:[], sessions:[], plans:[], payments:[], exercises:[], punchCards:[] };
let currentTrainerId = null;
let currentTrainerName = '';
let currentTrainerIsAdmin = false;

function load(col) { return cache[col] || []; }

async function saveItem(col, item) {
  if (col !== 'exercises' && currentTrainerId && !item.trainerId) {
    item.trainerId = currentTrainerId;
  }
  const idx = cache[col].findIndex(x => x.id === item.id);
  if (idx >= 0) cache[col][idx] = item;
  else cache[col].push(item);
  await db.collection(col).doc(item.id).set(item);
}

async function deleteItem(col, id) {
  if (col !== 'exercises' && currentTrainerId) {
    const doc = await db.collection(col).doc(id).get();
    if (doc.exists && doc.data().trainerId && doc.data().trainerId !== currentTrainerId) return;
  }
  cache[col] = cache[col].filter(x => x.id !== id);
  await db.collection(col).doc(id).delete();
}

async function initDB() {
  const cols = Object.keys(cache);
  await Promise.all(cols.map(async col => {
    const snap = await db.collection(col).get();
    let items = snap.docs.map(doc => ({ ...doc.data(), id: doc.id }));
    if (col !== 'exercises' && currentTrainerId) {
      items = items.filter(item => !item.trainerId || item.trainerId === currentTrainerId);
    }
    cache[col] = items;
  }));
  // Show trainer name in nav
  if (currentTrainerName) {
    const el = document.getElementById('nav-trainer-name');
    if (el) {
      el.textContent = currentTrainerName;
      el.classList.add('trainer-name-gold');
    }
  }
}

// ===== HELPERS =====
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function localDateStr(d) { d = d || new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function clientName(id) { const c = load('clients').find(x=>x.id===id); return c ? c.name : '—'; }
function clientBalance(clientId) {
  const totalPaid = load('payments').filter(p=>p.clientId===clientId && p.status==='paid' && !p.punchCardId).reduce((sum,p)=>sum+(+p.amount||0),0);
  const sessions = load('sessions').filter(s=>s.clientId===clientId && s.type==='training' && s.status!=='cancelled' && !s.punchCardId && s.source!=='client');
  const totalDebt = sessions.reduce((sum,s)=>sum+(+s.price||0),0);
  return { totalPaid, totalDebt, balance: totalPaid - totalDebt, sessions: sessions.length };
}
function punchCardSessions(cardId) {
  return load('sessions').filter(s => s.punchCardId === cardId && s.type === 'training' && s.status !== 'cancelled');
}
function punchCardSessionsUsed(cardId) {
  return load('sessions').filter(s => s.punchCardId === cardId && s.type === 'training' && s.status !== 'cancelled' && s.date <= localDateStr());
}
function punchCardSessionsBooked(cardId) {
  return load('sessions').filter(s => s.punchCardId === cardId && s.type === 'training' && s.status !== 'cancelled' && s.date > localDateStr());
}
function planName(id) { const p = load('plans').find(x=>x.id===id); return p ? p.name : ''; }
function clientOptions(sel='') {
  return load('clients').map(c=>`<option value="${c.id}"${c.id===sel?' selected':''}>${esc(c.name)}</option>`).join('');
}
function planOptionsForClient(clientId, selPlanId='') {
  const plans = load('plans').filter(p => p.clientId === clientId && !p.isTemplate);
  if (!plans.length) return '<option value="">— אין תוכניות —</option>';
  return '<option value="">— ללא תוכנית —</option>' + plans.map(p =>
    `<option value="${p.id}"${p.id===selPlanId?' selected':''}>${esc(p.name)}</option>`
  ).join('');
}
function bankOptions() {
  const exs = load('exercises');
  if (!exs.length) return '';
  const cats = [...new Set(exs.map(e=>e.category))];
  let html = '<option value="">— בחר מהבנק —</option>';
  cats.forEach(cat => {
    html += `<optgroup label="${esc(cat)}">`;
    exs.filter(e=>e.category===cat).forEach(e => { html += `<option value="${e.id}">${esc(e.name)}</option>`; });
    html += '</optgroup>';
  });
  return html;
}
function statusBadgeClass(status) { if (status==='בהשהיה') return 'badge-paused'; if (status==='הפסיק') return 'badge-stopped'; return 'badge-active'; }
let payFilter = { active: false, month: null, fromDate: '', toDate: '', clientId: '' };
let _payTab = 'summary';
let _payDetail = { active: false, type: '', id: '' };
let _payDetailRenderer = 'payments';
let _payTrainingFilter = (()=>{ const d=new Date(); const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), lastDay=String(new Date(d.getFullYear(),d.getMonth()+1,0).getDate()).padStart(2,'0'); return { clientId:'', fromDate:`${y}-${m}-01`, toDate:`${y}-${m}-${lastDay}` }; })();
let _payPunchFilter = { searchQ: '' };
let _payPlanFilter  = { searchQ: '' };
let _paySummaryMonthOffset = 0;
let _paySummaryMode = 'income'; // 'income' | 'debts'
let _paySummaryMonth = (()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; })(); // 'YYYY-MM' or '' for all time

function openPayDetail(type, id, renderer) { _payDetail = { active:true, type, id }; _payDetailRenderer = renderer||'payments'; if (_payDetailRenderer==='products') renderProducts(); else renderPayments(); }
function closePayDetail() { _payDetail = { active:false, type:'', id:'' }; if (_payDetailRenderer==='products') renderProducts(); else renderPayments(); }
function switchPayTab(tab) { _payTab = tab; _payDetail = { active:false, type:'', id:'' }; renderPayments(); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// Filter out client-created sessions from trainer views
function trainerSessions() { return load('sessions').filter(s => s.source !== 'client' && s.source !== 'client_trainer'); }
function fmtDate(d) { if (!d) return ''; const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }
function fmtDateLong(d) { if (!d) return ''; return new Date(d+'T00:00').toLocaleDateString('he-IL',{weekday:'long',year:'numeric',month:'long',day:'numeric'}); }
function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00');
  d.setDate(d.getDate() + days);
  return localDateStr(d);
}
function calcShiftHours(startTime, endTime) {
  if (!startTime || !endTime) return 0;
  const [sh, sm] = startTime.split(':').map(Number);
  const [eh, em] = endTime.split(':').map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins < 0) mins += 24 * 60; // overnight shift
  return mins / 60;
}

// Migrate old exercise format (sets+reps numbers) to new per-set format
function migrateExercise(e) {
  if (e.setsData && e.setsData.length) return e;
  const numSets = +e.sets || 3;
  const reps = +e.reps || 10;
  return {
    name: e.name || '',
    category: e.category || '',
    videoUrl: e.videoUrl || '',
    setsData: Array.from({length: numSets}, () => ({targetReps: reps, weight: '', notes: ''}))
  };
}

let _onModalSubmit = null;
function openModal(title, bodyHTML, onSubmit) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-overlay').classList.add('open');

  const form = document.getElementById('modal-form');
  if (form && onSubmit) form.addEventListener('submit', handleModalSubmit);
}
async function handleModalSubmit(e) {
  e.preventDefault();
  const btn = e.target.querySelector('[type=submit]');
  if (btn) { btn.disabled = true; btn.textContent = 'שומר...'; }
  try {
    if (_onModalSubmit) await _onModalSubmit(new FormData(e.target));
    closeModal();
  } catch(err) {
    console.error(err);
    showToast('שגיאה בשמירה. בדוק חיבור לאינטרנט.');
    if (btn) { btn.disabled = false; btn.textContent = 'שמור'; }
  }
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-body').innerHTML = '';

}

const RENDERERS = { clients:renderClients, schedule:renderSchedule, exercises:renderExercises, workouts:renderWorkouts, payments:renderPayments, products:renderProducts, reminders:renderReminders, admin:renderAdmin };

function switchTabMore(tab) { document.getElementById('nav-more-dropdown').classList.remove('open'); switchTab(tab); }

async function switchTab(name) {
  if (_planBuilder.active && !confirm('יש תוכנית בעריכה — לצאת בלי לשמור?')) return;

  const notesHtml = c.notes ? `<div style="margin-bottom:4px"><span style="color:var(--muted);font-size:.85rem">הערות: </span><span style="color:var(--text);font-size:.9rem">${esc(c.notes)}</span></div>` : '';
  const goalsHtml = c.goals ? `<div style="margin-bottom:4px"><span style="color:var(--muted);font-size:.85rem">מטרות: </span><span style="color:var(--text);font-size:.9rem">${esc(c.goals)}</span></div>` : '';
  const emailHtml = c.email ? `<div style="margin-bottom:4px"><span style="color:var(--muted);font-size:.85rem">אימייל: </span><span style="color:var(--text);font-size:.9rem">${esc(c.email)}</span></div>` : '';
  const ageHtml = c.age ? `<div style="margin-bottom:4px"><span style="color:var(--muted);font-size:.85rem">גיל: </span><span style="color:var(--text);font-size:.9rem">${esc(c.age)}</span></div>` : '';
  const info = `<div style="margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:1.35rem;font-weight:700;color:var(--text)">${esc(c.name)}</span>
      <span class="badge ${statusBadgeClass(c.status||'פעיל')}" style="font-size:.75rem">${esc(c.status||'פעיל')}</span>
    </div>
    ${phoneHtml}${emailHtml}${ageHtml}${goalsHtml}${notesHtml}
    <button class="btn btn-sm" style="margin-top:8px" onclick="closeClientProfile();openEditClient('${c.id}')">✏ עריכה</button>
  </div>`;

  // --- 3 summary boxes ---
  const pcRemaining = ownedCards.reduce((s,pc)=>{ const u=punchCardSessionsUsed(pc.id).length,b2=punchCardSessionsBooked(pc.id).length; return s+(pc.totalSessions-u-b2); },0);
  const pcTotal = ownedCards.reduce((s,pc)=>s+pc.totalSessions,0);
  const hasPc = ownedCards.length > 0;
  const pcBox = `<div class="card" style="flex:1;min-width:120px;text-align:center;${hasPc?'border-color:var(--accent2)':'opacity:.5'}">
    <div class="card-title">כרטיסייה</div>
    ${hasPc?`<div style="color:var(--accent2);font-size:1.1rem;font-weight:700">${pcRemaining}/${pcTotal} נשאר</div>`:`<div style="color:var(--muted);font-size:.9rem">אין כרטיסייה</div>`}
  </div>`;
  const paidBox = `<div class="card" style="flex:1;min-width:120px;text-align:center">
    <div class="card-title">תשלום מצטבר</div>
    <div style="color:#4caf50;font-size:1.1rem;font-weight:700">₪${totalPaid.toLocaleString()}</div>
  </div>`;
  const balBox = `<div class="card" style="flex:1;min-width:120px;text-align:center;border-color:${balBorder}">
    <div class="card-title">חשבון</div>
    <div style="color:${balColor};font-size:1.1rem;font-weight:700">${balText}</div>
  </div>`;
  const summary = `<div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">${pcBox}${paidBox}${balBox}</div>`;

  // --- Payments history ---
  const sortedPays = [...allPayments].sort((a,b)=>a.date<b.date?1:-1);
  const payRows = sortedPays.length ? sortedPays.map(p=>`<tr>
    <td>₪${(+p.amount||0).toLocaleString()}</td>
    <td>${fmtDate(p.date)}</td>
    <td style="font-size:.85rem;color:var(--accent2)">${fmtPayMethod(p)}</td>
    <td style="color:var(--muted);font-size:.85rem">${esc(p.notes||'—')}</td>
    <td class="actions" style="text-align:left">
      <button class="btn btn-ghost btn-sm" onclick="openEditPayment('${p.id}');setTimeout(()=>cpSwitchTab('details'),100)">עריכה</button>
      <button class="btn btn-danger btn-sm" onclick="deleteCpPayment('${p.id}','${c.id}')">מחק</button>
    </td>
  </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--muted)">אין תשלומים</td></tr>';
  const payTable = `<div class="cp-section">
    <div class="cp-section-title">היסטוריית תשלומים</div>
    <div style="margin-bottom:8px"><button class="btn btn-sm" onclick="openAddClientPayment('${c.id}')">+ הוסף תשלום</button></div>
    <div class="table-wrap"><table><thead><tr><th>סכום</th><th>תאריך</th><th>אמצעי תשלום</th><th>הערות</th><th style="text-align:left">פעולות</th></tr></thead><tbody>${payRows}</tbody></table></div>
  </div>`;

  // --- Sessions history ---
  const allSess = load('sessions').filter(s=>s.clientId===c.id&&s.type==='training'&&s.status!=='cancelled'&&s.source!=='client').sort((a,b)=>a.date<b.date?1:-1);
  const availCards = load('punchCards').filter(pc=>{ const u=punchCardSessionsUsed(pc.id).length,b2=punchCardSessionsBooked(pc.id).length; return pc.totalSessions-u-b2>0; });
  const editSessId = _cpEditSessionId;
  const sessRows = allSess.length ? allSess.map(s=>{
    const isFuture = s.date > today;
    const rowStyle = isFuture ? 'opacity:.7;font-style:italic' : '';
    const futureTag = isFuture ? ' <span style="font-size:.72rem;color:var(--accent2)">(עתידי)</span>' : '';
    if (editSessId === s.id) {
      // Edit mode row
      const pcOpts = `<option value="">— בודד —</option>`+availCards.map(pc=>{
        const u=punchCardSessionsUsed(pc.id).length,b2=punchCardSessionsBooked(pc.id).length;
        return `<option value="${pc.id}"${s.punchCardId===pc.id?' selected':''}>${esc(pc.name||clientName(pc.ownerClientId))} (${pc.totalSessions-u-b2})</option>`;
      }).join('');
      const initMode = s.punchCardId ? 'punch' : 'price';
      return `<tr style="background:rgba(255,255,255,.03)">
        <td>${fmtDate(s.date)} ${futureTag}</td>
        <td>${esc(s.time||'—')}</td>
        <td colspan="2">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--border);flex-shrink:0">
              <button type="button" id="cp-billing-price-${s.id}" onclick="cpSwitchBilling('${s.id}','price')" style="padding:5px 10px;border:none;cursor:pointer;font-family:inherit;font-size:.82rem;${initMode==='price'?'background:var(--gold);color:#fff;font-weight:600':'background:var(--card);color:var(--muted)'}">מחיר</button>
              <button type="button" id="cp-billing-punch-${s.id}" onclick="cpSwitchBilling('${s.id}','punch')" style="padding:5px 10px;border:none;cursor:pointer;font-family:inherit;font-size:.82rem;${initMode==='punch'?'background:var(--gold);color:#fff;font-weight:600':'background:var(--card);color:var(--muted)'}">כרטיסייה</button>
            </div>
            <input id="cp-sess-price-${s.id}" type="number" min="0" step="1" value="${esc(s.price||'')}" placeholder="0" style="width:80px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 8px;font-size:.85rem;font-family:inherit;${initMode==='punch'?'display:none':''}">
            <select id="cp-sess-punch-${s.id}" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 8px;font-size:.82rem;font-family:inherit;${initMode==='price'?'display:none':''}">${pcOpts}</select>
          </div>
        </td>
        <td class="actions">
          <button class="btn btn-sm" onclick="cpSaveSessEdit('${s.id}','${c.id}')">שמור</button>
          <button class="btn btn-ghost btn-sm" onclick="_cpEditSessionId='';renderClientProfile()">ביטול</button>
        </td>
      </tr>`;
    }
    // View mode row
    let billingDisplay;
    if (s.punchCardId) {
      const pc = load('punchCards').find(x=>x.id===s.punchCardId);
      billingDisplay = `<span style="color:var(--accent2);font-size:.85rem">🎟 ${esc(pc?.name||clientName(pc?.ownerClientId)||'כרטיסייה')}</span>`;
    } else if (s.price) {
      billingDisplay = `<span style="color:${isFuture?'var(--muted)':'#4caf50'};font-weight:600">₪${(+s.price).toLocaleString()}</span>`;
    } else {
      billingDisplay = `<span style="color:var(--muted)">—</span>`;
    }
    return `<tr style="${rowStyle}">
      <td>${fmtDate(s.date)}${futureTag}</td>
      <td>${esc(s.time||'—')}</td>
      <td>${billingDisplay}</td>
      <td></td>
      <td class="actions"><button class="btn btn-ghost btn-sm" onclick="_cpEditSessionId='${s.id}';renderClientProfile()">עריכה</button></td>
    </tr>`;
  }).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--muted)">אין אימונים</td></tr>';
  const sessTable = `<div class="cp-section" style="margin-top:16px">
    <div class="cp-section-title">היסטוריית אימונים</div>
    <div class="table-wrap"><table><thead><tr><th>תאריך</th><th>שעה</th><th>עלות / כרטיסייה</th><th></th><th></th></tr></thead><tbody>${sessRows}</tbody></table></div>
  </div>`;

  // --- Punch cards history ---
  const pcRows = ownedCards.length ? ownedCards.sort((a,b)=>a.createdAt<b.createdAt?1:-1).map(pc=>{
    const u=punchCardSessionsUsed(pc.id).length, b2=punchCardSessionsBooked(pc.id).length;
    const rem=pc.totalSessions-u-b2;
    const isEmpty=rem===0&&b2===0;
    const remColor=isEmpty?'var(--accent)':rem<=2?'var(--shift)':'#4caf50';
    const mutedStyle=isEmpty?'color:var(--muted)':'';
    const dateStr=pc.date||pc.createdAt?new Date(pc.date||pc.createdAt).toLocaleDateString('he-IL'):'—';
    return `<tr${isEmpty?' style="opacity:.6"':''}>
      <td style="${mutedStyle}">${esc(pc.name||'כרטיסייה')}</td>
      <td style="text-align:center;${mutedStyle}">${pc.totalSessions}</td>
      <td style="font-size:.85rem;color:var(--muted)">${dateStr}</td>
      <td style="${mutedStyle}">${u}</td>
      <td style="color:${isEmpty?'var(--muted)':'var(--accent2)'}">${b2}</td>
      <td style="color:${remColor};font-weight:700">${rem}</td>
      <td style="${mutedStyle}">${pc.price?`₪${(+pc.price).toLocaleString()}`:'—'}</td>
      <td class="actions">
        <button class="btn btn-ghost btn-sm" onclick="switchTab('products');_productsTab='punch_card';openPayDetail('punch_card','${pc.id}','products')">פרטים</button>
        <button class="btn btn-sm" onclick="openAddPunchCardPayment('${pc.id}')">+ תשלום</button>
        <button class="btn btn-ghost btn-sm" onclick="openEditPunchCard('${pc.id}')">עריכה</button>
        <button class="btn btn-danger btn-sm" onclick="deletePunchCardFromProfile('${pc.id}','${c.id}')">מחק</button>
      </td>
    </tr>`;
  }).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--muted)">אין כרטיסיות</td></tr>';
  const pcTable = `<div class="cp-section" style="margin-top:16px">
    <div class="cp-section-title">היסטוריית כרטיסיות</div>
    <div style="margin-bottom:8px"><button class="btn btn-sm" onclick="openAddPunchCardForClient('${c.id}')">+ הוסף כרטיסייה</button></div>
    <div class="table-wrap"><table><thead><tr><th>שם</th><th>מספר אימונים</th><th>תאריך</th><th>נוצל</th><th>מוזמן</th><th>נשאר</th><th>מחיר</th><th></th></tr></thead><tbody>${pcRows}</tbody></table></div>
  </div>`;

  // --- Plans history ---
  const planTable = `<div class="cp-section" style="margin-top:16px">
    <div class="cp-section-title">היסטוריית תוכניות</div>
    <div style="margin-bottom:8px"><button class="btn btn-sm" onclick="openAddPlanForClient('${c.id}')">+ הוסף תוכנית</button></div>
    ${planRows('', c.id)}
  </div>`;

  return info + summary + payTable + sessTable + pcTable + planTable;
}

function openAddClientPayment(clientId) {
  openModal('הוסף תשלום / רכישה', purchaseFormHTML(clientId), async fd => {
    const product = fd.get('product')||'session';
    const date = fd.get('date'), method = fd.get('paymentMethod')||'', transfer = fd.get('transferMethod')||'', notes = fd.get('notes')||'', amount = fd.get('amount');
    if (product === 'card') {
      const pcMode = fd.get('pcMode')||'new';
      if (pcMode === 'existing') {
        const existingPcId = fd.get('existingPcId');
        if (!existingPcId) { alert('יש לבחור כרטיסייה קיימת'); return; }
        const pc = load('punchCards').find(x=>x.id===existingPcId);
        await saveItem('payments', {id:uid(), clientId:pc?.ownerClientId||clientId, amount, date, status:'paid', punchCardId:existingPcId, paymentMethod:method, transferMethod:transfer, notes});
      } else {
        const pcId = uid();
        await saveItem('punchCards', {id:pcId, ownerClientId:clientId, name:fd.get('pcName')||'כרטיסייה', totalSessions:+(fd.get('pcSessions')||0), price:fd.get('pcPrice')||'0', linkedClientIds:[], notes:'', createdAt:new Date().toISOString()});
        await saveItem('payments', {id:uid(), clientId, amount, date, status:'paid', punchCardId:pcId, paymentMethod:method, transferMethod:transfer, notes});
      }
    } else if (product === 'plan') {
      const planMode = fd.get('planMode')||'new';
      if (planMode === 'existing') {
        const existingPlanId = fd.get('existingPlanId');
        if (!existingPlanId) { alert('יש לבחור תוכנית קיימת'); return; }
        await saveItem('payments', {id:uid(), clientId, amount, date, status:'paid', paymentMethod:method, transferMethod:transfer, notes});
      } else {
        await saveItem('plans', {id:uid(), clientId, name:fd.get('planName')||'תוכנית אימונים', price:fd.get('planPrice')||'0', isTemplate:false, exercises:[], notes:'', createdAt:new Date().toISOString()});
        await saveItem('payments', {id:uid(), clientId, amount, date, status:'paid', paymentMethod:method, transferMethod:transfer, notes});
      }
    } else {
      await saveItem('payments', {id:uid(), clientId, amount, date, status:'paid', paymentMethod:method, transferMethod:transfer, notes});
    }
    if (_clientProfile.active) renderClientProfile(); else if (_payDetailRenderer==='products') renderProducts(); else renderPayments();
  });
}

async function deleteCpPayment(payId, clientId) {
  if (!confirm('למחוק תשלום זה?')) return;
  await deleteItem('payments', payId);
  if (_clientProfile.active) renderClientProfile(); else if (_payDetailRenderer==='products') renderProducts(); else renderPayments();
}

function renderClients() {
  if (_clientProfile.active) { renderClientProfile(); return; }
  const ctrl = document.getElementById('clients-controls');
  if (ctrl) ctrl.style.display = 'flex';
  const clients  = load('clients');
  const sessions = load('sessions');
  const payments = load('payments');
  const today    = localDateStr();
  const statusFilter = document.getElementById('client-status-filter')?.value || 'all';
  const searchTerm = (document.getElementById('client-search')?.value || '').toLowerCase();
  const filtered = clients.filter(c => {
    if (statusFilter !== 'all' && (c.status || 'פעיל') !== statusFilter) return false;
    if (searchTerm && !(c.name||'').toLowerCase().includes(searchTerm) && !(c.phone||'').includes(searchTerm)) return false;
    return true;
  });
  const monthStart = (()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; })();
  const monthIncome = payments.filter(p=>p.status==='paid'&&p.date>=monthStart).reduce((s,p)=>s+(+p.amount||0),0);
  const totalDebt = clients.reduce((sum,c)=>{
    const sessDebt=load('sessions').filter(s=>s.clientId===c.id&&s.type==='training'&&s.status!=='cancelled'&&!s.punchCardId&&s.source!=='client').reduce((s,x)=>s+(+x.price||0),0);
    const planDebt=load('plans').filter(p=>p.clientId===c.id&&!p.isTemplate&&p.price).reduce((s,p)=>s+(+p.price||0),0);
    const pcDebt=load('punchCards').filter(pc=>pc.ownerClientId===c.id).reduce((s,pc)=>s+(+pc.price||0),0);
    const totalPaid=payments.filter(p=>p.clientId===c.id&&p.status==='paid').reduce((s,p)=>s+(+p.amount||0),0);
    const debt=sessDebt+planDebt+pcDebt-totalPaid;
    return sum+(debt>0?debt:0);
  },0);
  document.getElementById('dashboard').innerHTML = `
    <div class="card"><div class="card-title">הכנסות החודש</div><div class="card-value" style="color:#4caf50">₪${monthIncome.toLocaleString()}</div></div>
    <div class="card"><div class="card-title">לקוחות פעילים</div><div class="card-value" style="color:#4caf50">${clients.filter(c=>(c.status||'פעיל')==='פעיל').length}</div></div>
    <div class="card"><div class="card-title">חובות פתוחים</div><div class="card-value" style="color:var(--accent)">₪${totalDebt.toLocaleString()}</div></div>
  `;
  const statusOrder = {'פעיל':0,'בהשהיה':1,'הפסיק':2};
  filtered.sort((a,b)=>{
    const so=(statusOrder[a.status||'פעיל']||0)-(statusOrder[b.status||'פעיל']||0);
    if (so!==0) return so;
    return (a.name||'').localeCompare(b.name||'','he');
  });
  if (!filtered.length) { document.getElementById('clients-table').innerHTML=`<div class="empty">${clients.length?'אין לקוחות בסטטוס הנבחר.':'אין לקוחות עדיין. הוסף את הראשון!'}</div>`; return; }
  document.getElementById('clients-table').innerHTML = `<table>
    <thead><tr><th>שם</th><th>סטטוס</th><th>טלפון</th><th>פעולות</th></tr></thead>
    <tbody>${filtered.map(c=>`<tr>
      <td><strong><a href="#" onclick="event.preventDefault();openClientProfile('${c.id}')" style="color:var(--accent2);text-decoration:none">${esc(c.name)}</a></strong></td><td><span class="badge ${statusBadgeClass(c.status||'פעיל')}">${esc(c.status||'פעיל')}</span></td><td>${esc(c.phone)}</td>
      <td class="actions">
        <button class="btn btn-ghost btn-sm" onclick="openEditClient('${c.id}')">עריכה</button>
        <button class="btn btn-danger btn-sm" onclick="deleteClient('${c.id}')">מחק</button>
      </td></tr>`).join('')}</tbody></table>`;
}

function openAddClient() {
  openModal('הוסף לקוח', clientForm(), async fd => {
    await saveItem('clients', {id:uid(), name:fd.get('name'), phone:fd.get('phone'), email:fd.get('email'), age:fd.get('age'), taxId:fd.get('taxId'), goals:fd.get('goals'), notes:fd.get('notes'), status:fd.get('status')||'פעיל'});

function openEditClient(id) {
  const c = load('clients').find(x=>x.id===id);
  openModal('עריכת לקוח', clientForm(c), async fd => {
    Object.assign(c, {name:fd.get('name'), phone:fd.get('phone'), email:fd.get('email'), age:fd.get('age'), taxId:fd.get('taxId'), goals:fd.get('goals'), notes:fd.get('notes'), status:fd.get('status')});

}
async function deleteClient(id) {
  if (!confirm('למחוק את הלקוח? פעולה זו תמחק גם את האימונים והתשלומים שלו.')) return;
  const sessionIds = load('sessions').filter(x=>x.clientId===id).map(x=>x.id);
  const planIds    = load('plans').filter(x=>x.clientId===id).map(x=>x.id);
  const paymentIds = load('payments').filter(x=>x.clientId===id).map(x=>x.id);
  await Promise.all([
    deleteItem('clients', id),
    ...sessionIds.map(i=>deleteItem('sessions',i)),
    ...planIds.map(i=>deleteItem('plans',i)),
    ...paymentIds.map(i=>deleteItem('payments',i))
  ]);
  renderClients();
}

let calYear, calMonth;
let _calSelectedDate = localDateStr();
let _calView = 'month'; // 'month' | 'week'
let _calWeekStart = ''; // YYYY-MM-DD of Sunday
let _liveWorkout = { active:false, sessionId:'', currentIdx:0, log:[], session:null, previousData:{}, saveTimer:null, showSwapBrowser:false, swapExpandedCat:'' };

function renderSchedule() {
  if (_liveWorkout.active) { renderLiveWorkout(); return; }
  const now = new Date();
  if (calYear === undefined) calYear = now.getFullYear();
  if (calMonth === undefined) calMonth = now.getMonth();
  if (!_calWeekStart) { const d=new Date(); d.setDate(d.getDate()-d.getDay()); _calWeekStart=localDateStr(d); }
  // Update toggle buttons
  const _btnM = document.getElementById('cal-view-month');
  const _btnW = document.getElementById('cal-view-week');
  if (_btnM) { _btnM.style.background = _calView==='month' ? 'var(--gold)' : 'var(--card)'; _btnM.style.color = _calView==='month' ? '#fff' : 'var(--muted)'; _btnM.style.fontWeight = _calView==='month' ? '600' : '400'; }
  if (_btnW) { _btnW.style.background = _calView==='week' ? 'var(--gold)' : 'var(--card)'; _btnW.style.color = _calView==='week' ? '#fff' : 'var(--muted)'; _btnW.style.fontWeight = _calView==='week' ? '600' : '400'; }
  if (_calView==='month') renderCalendarMonth(); else renderCalendarWeek();
  renderSessionsTable();
}
function setCalView(view) { _calView=view; renderSchedule(); }
function calPrev() {
  if (_calView==='month') { calMonth--; if(calMonth<0){calMonth=11;calYear--;} }
  else { _calWeekStart=addDays(_calWeekStart,-7); }
  renderSchedule();
}
function calNext() {
  if (_calView==='month') { calMonth++; if(calMonth>11){calMonth=0;calYear++;} }
  else { _calWeekStart=addDays(_calWeekStart,7); }
  renderSchedule();
}

function renderCalendarMonth() {
  const sessions = trainerSessions();
  const today = localDateStr();
  const monthNames = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  document.getElementById('cal-title').textContent = `${monthNames[calMonth]} ${calYear}`;
  const firstDay = new Date(calYear,calMonth,1).getDay();
  const daysInMonth = new Date(calYear,calMonth+1,0).getDate();
  const sessionMap = {};
  sessions.forEach(s => { if(!sessionMap[s.date])sessionMap[s.date]=[]; sessionMap[s.date].push(s); });
  const dayNames = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
  let html = '<div class="cal-grid">' + dayNames.map(d=>`<div class="cal-day-name">${d}</div>`).join('');
  for (let i=0;i<firstDay;i++) html+='<div class="cal-day empty-day"></div>';
  for (let d=1;d<=daysInMonth;d++) {
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const daySessions = sessionMap[ds]||[];
    let dots = '';
    if (daySessions.length) { dots=`<div class="cal-dots">${daySessions.slice(0,5).map(s=>{const cls=s.status==='cancelled'?' cancelled-dot':s.type==='shift'?' shift-dot':s.type==='personal'?' personal-dot':'';return `<div class="cal-dot${cls}"></div>`;}).join('')}</div>`; }
    html+=`<div class="cal-day${ds===today?' today':''}${ds===_calSelectedDate?' selected':''}" onclick="handleCalDayClick('${ds}')"><div class="cal-day-num">${d}</div>${dots}</div>`;
  }
  html += '</div>';
  document.getElementById('cal-container').innerHTML=html;
  const trainingSessions = trainerSessions().filter(s=>s.type==='training'&&s.status!=='cancelled');
  const monthStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}`;
  const monthCount = trainingSessions.filter(s=>s.date.startsWith(monthStr)).length;
  const weekEnd2 = addDays(_calWeekStart,6);
  const weekCount = trainingSessions.filter(s=>s.date>=_calWeekStart&&s.date<=weekEnd2).length;
  const smEl = document.getElementById('cal-stat-month');
  const swEl = document.getElementById('cal-stat-week');
  if (smEl) smEl.textContent = `אימונים החודש: ${monthCount}`;
  if (swEl) swEl.textContent = `אימונים השבוע: ${weekCount}`;
}

function renderCalendarWeek() {
  const sessions = trainerSessions();
  const today = localDateStr();
  const dayNames = ['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
  const monthNames = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const weekEnd = addDays(_calWeekStart, 6);
  const wsDate = new Date(_calWeekStart+'T00:00');
  const weDate = new Date(weekEnd+'T00:00');
  const title = wsDate.getMonth()===weDate.getMonth()
    ? `${wsDate.getDate()}–${weDate.getDate()} ${monthNames[wsDate.getMonth()]} ${wsDate.getFullYear()}`
    : `${wsDate.getDate()} ${monthNames[wsDate.getMonth()]} – ${weDate.getDate()} ${monthNames[weDate.getMonth()]}`;
  document.getElementById('cal-title').textContent = title;

  // Build session map for this week
  const sessionMap = {};
  sessions.forEach(s => { if(s.date>=_calWeekStart&&s.date<=weekEnd){ if(!sessionMap[s.date])sessionMap[s.date]=[]; sessionMap[s.date].push(s); }});

  let html = '<div class="week-grid">';
  for (let i=0;i<7;i++) {
    const ds = addDays(_calWeekStart, i);
    const d = new Date(ds+'T00:00');
    const daySessions = sessionMap[ds]||[];
    const sessHtml = daySessions.sort((a,b)=>(a.time||a.startTime||'')<(b.time||b.startTime||'')?-1:1).map(s => {
      const isShift = s.type==='shift';
      const isCancelled = s.status==='cancelled';
      const isPersonal = s.type === 'personal';
      const label = isShift ? 'משמרת' : isPersonal ? (s.notes||'אירוע אישי') : clientName(s.clientId);
      const labelHtml = (!isShift&&!isPersonal) ? `<a href="#" onclick="event.preventDefault();event.stopPropagation();switchTab('clients');openClientProfile('${s.clientId}')" style="color:inherit;text-decoration:none">${esc(label)}</a>` : esc(label);
      return `<div class="week-session${isShift?' shift':''}${isPersonal?' personal':''}${isCancelled?' cancelled':''}">${labelHtml}</div>`;
    }).join('');
    html += `<div class="week-col${ds===today?' today':''}${ds===_calSelectedDate?' selected':''}" onclick="handleCalDayClick('${ds}')">
      <div class="week-col-header"><div class="week-col-day">${dayNames[i]}</div><div class="week-col-num">${d.getDate()}</div></div>
      ${sessHtml}
    </div>`;
  }
  html += '</div>';
  document.getElementById('cal-container').innerHTML=html;
  // Stats bar
  const trainingSessions2 = sessions.filter(s=>s.type==='training'&&s.status!=='cancelled');
  const weekCount2 = trainingSessions2.filter(s=>s.date>=_calWeekStart&&s.date<=weekEnd).length;
  const monthStr2 = _calWeekStart.substring(0,7);
  const monthCount2 = trainingSessions2.filter(s=>s.date.startsWith(monthStr2)).length;
  const smEl2 = document.getElementById('cal-stat-month');
  const swEl2 = document.getElementById('cal-stat-week');
  if (smEl2) smEl2.textContent = `אימונים החודש: ${monthCount2}`;
  if (swEl2) swEl2.textContent = `אימונים השבוע: ${weekCount2}`;
}

function handleCalDayClick(dateStr) {
  _calSelectedDate = dateStr;
  renderSchedule();
}

function renderSessionsTable() {
  const allSessions = trainerSessions();
  const filtered = allSessions.filter(s=>s.date===_calSelectedDate)
    .sort((a,b)=>(a.time||a.startTime||'')<(b.time||b.startTime||'')?-1:1);
  const headingEl = document.getElementById('schedule-day-heading');
  if (headingEl) headingEl.textContent = fmtDateLong(_calSelectedDate);
  // Today summary
  const trainingCount = filtered.filter(s=>s.type==='training'&&s.status!=='cancelled').length;
  const hasShift = filtered.some(s=>s.type==='shift'&&s.status!=='cancelled');
  const hasPersonal = filtered.some(s=>s.type==='personal');
  const stEl = document.getElementById('today-stat-training');
  if (stEl) {
    const parts = [`<span style="color:var(--accent2)">סיכום יומי: ${trainingCount} אימונים אישיים</span>`];
    if (hasShift) parts.push(`<span style="color:#4caf50">✅ משמרת</span>`);
    if (hasPersonal) parts.push(`<span style="color:#4caf50">✅ לו״ז אישי</span>`);
    stEl.innerHTML = parts.join(`<span style="color:var(--muted)"> · </span>`);
  }
  if (!filtered.length) { document.getElementById('sessions-table').innerHTML='<div class="empty">אין אימונים ביום הזה.</div>'; return; }
  document.getElementById('sessions-table').innerHTML=`<table>
    <thead><tr><th>סוג</th><th>לקוח</th><th>שעה</th><th>פרטים</th><th>עלות / כרטיסייה</th><th>הערות</th><th>פעולות</th></tr></thead>
    <tbody>${filtered.map(s=>{
      const isShift = s.type === 'shift';
      const isPersonal = s.type === 'personal';
      const isCancelled = s.status==='cancelled';
      const typeBadge = isShift ? '<span class="badge badge-shift">משמרת</span>' : isPersonal ? '<span class="badge" style="background:#1565c0;color:#fff">אישי</span>' : '🏋️';
      const cancelledBadge = isCancelled ? ' <span class="badge badge-cancelled">בוטל</span>' : '';
      const recurring = s.recurringGroupId ? ' <span class="badge badge-recurring">🔁</span>' : '';
      const logBadge = (s.log && s.log.length) ? ' <span class="badge badge-logged">תועד</span>' : '';
      const clientCol = isShift ? '—' : `<a href="#" onclick="event.preventDefault();switchTab('clients');openClientProfile('${s.clientId}')" style="color:var(--accent2);text-decoration:none">${esc(clientName(s.clientId))}</a>`;
      let timeCol, detailsCol;
      if (isShift) {
        timeCol = `${esc(s.startTime||'')}–${esc(s.endTime||'')}`;
        const hrs = calcShiftHours(s.startTime, s.endTime);
        const total = s.hourlyRate ? `₪${(hrs * +s.hourlyRate).toFixed(0)}` : '';
        detailsCol = `${hrs.toFixed(1)} שעות${total ? ' · ' + total : ''}`;
      } else {
        timeCol = esc(s.time);
        detailsCol = `${esc(s.duration)} דק׳`;
      }
      let costCol = '—';
      if (!isShift) {
        if (s.punchCardId) {
          const pc = load('punchCards').find(x=>x.id===s.punchCardId);
          costCol = `<span style="color:var(--accent2);font-size:.85rem">🎟 ${esc(pc?.name||clientName(pc?.ownerClientId)||'כרטיסייה')}</span>`;
        } else if (s.price) {
          costCol = `<span style="color:#4caf50;font-weight:600">₪${(+s.price).toLocaleString()}</span>`;
        }
      }
      const cancelBtn = isCancelled
        ? `<button class="btn btn-ghost btn-sm" onclick="toggleCancelSession('${s.id}')">שחזר</button>`
        : `<button class="btn btn-ghost btn-sm" style="color:var(--muted)" onclick="toggleCancelSession('${s.id}')">בטל</button>`;
      if (isPersonal) return `<tr style="background:rgba(21,101,192,.08);border-right:3px solid #1565c0">
        <td>${typeBadge}</td>
        <td colspan="2" style="color:var(--text)">${esc(s.startTime||'')}${s.startTime&&s.endTime?' – ':''}${esc(s.endTime||'')} ${esc(s.notes||'אירוע אישי')}</td>
        <td colspan="3"></td>
        <td class="actions">
          <button class="btn btn-ghost btn-sm" onclick="openEditPersonalEvent('${s.id}')">עריכה</button>
          <button class="btn btn-danger btn-sm" onclick="deleteSession('${s.id}')">מחק</button>
        </td>
      </tr>`;
      return `<tr class="${isCancelled?'cancelled-row':''}">
      <td>${typeBadge}${cancelledBadge}${recurring}</td>
      <td>${clientCol}</td><td>${timeCol}</td>
      <td>${detailsCol}</td>
      <td>${costCol}</td>
      <td style="color:var(--text)">${esc(s.notes)}${logBadge}</td>
      <td class="actions">
        ${!isShift && !isCancelled ? `<button class="btn btn-log btn-sm" onclick="openLiveWorkout('${s.id}')">📋</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="openEditSession('${s.id}')">עריכה</button>
        ${cancelBtn}
        <button class="btn btn-danger btn-sm" onclick="deleteSession('${s.id}')">מחק</button>
      </td></tr>`;
    }).join('')}</tbody></table>`;
}

function updateSessionPunchCard(clientId, selectedId='') {
  const dd = document.getElementById('session-punchcard-dd');
  const search = document.getElementById('session-punchcard-search');
  const hidden = document.getElementById('session-punchcard-sel');
  if (!dd) return;
  // Only cards with remaining sessions
  const allCards = load('punchCards').filter(pc => {
    const used = punchCardSessionsUsed(pc.id).length, booked = punchCardSessionsBooked(pc.id).length;
    return pc.totalSessions - used - booked > 0;
  });
  // Determine which sessions the client has used (to find cards they've punched before)
  const clientSessions = load('sessions').filter(s => s.clientId === clientId && s.punchCardId);
  const usedCardIds = new Set(clientSessions.map(s => s.punchCardId));
  // Priority: own card or previously used → top; others → below
  const priority = allCards.filter(pc => pc.ownerClientId === clientId || usedCardIds.has(pc.id));
  const others   = allCards.filter(pc => pc.ownerClientId !== clientId && !usedCardIds.has(pc.id));
  function cardItem(pc) {
    const used = punchCardSessionsUsed(pc.id).length, booked = punchCardSessionsBooked(pc.id).length;
    const rem = pc.totalSessions - used - booked;
    const label = `${esc(pc.name||clientName(pc.ownerClientId))} — ${esc(clientName(pc.ownerClientId))} (${rem}/${pc.totalSessions} נשאר)`;
    return `<div class="pc-opt" data-id="${pc.id}" data-name="${esc(pc.name||clientName(pc.ownerClientId))}" onclick="selectSessionPunchCard('${pc.id}','${esc(pc.name||clientName(pc.ownerClientId))}')" style="padding:10px 14px;cursor:pointer;font-size:.88rem" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="this.style.background=''">${label}</div>`;
  }
  let html = `<div class="pc-opt" data-id="" data-name="" onclick="selectSessionPunchCard('','')" style="padding:10px 14px;cursor:pointer;font-size:.88rem;color:var(--muted)" onmouseover="this.style.background='rgba(255,255,255,.06)'" onmouseout="this.style.background=''">— ללא כרטיסייה —</div>`;
  if (priority.length) html += `<div style="padding:4px 14px;font-size:.75rem;color:var(--gold);border-top:1px solid var(--border)">של הלקוח / בשימוש קודם</div>` + priority.map(cardItem).join('');
  if (others.length)   html += `<div style="padding:4px 14px;font-size:.75rem;color:var(--muted);border-top:1px solid var(--border)">אחרות</div>` + others.map(cardItem).join('');
  dd.innerHTML = html;
  // Restore selection if editing
  if (selectedId) {
    const pc = allCards.find(x => x.id === selectedId);
    if (pc && search) search.value = pc.name || clientName(pc.ownerClientId);
    if (hidden) hidden.value = selectedId;
  }
}

function openAddSession(date, type) {
  if (type === 'training' && !load('clients').length) { alert('יש להוסיף לקוח לפני הוספת אימון.'); return; }
  const title = type === 'shift' ? 'הוסף משמרת' : 'הוסף אימון';
  openModal(title, sessionForm({date:date||''}, type||'training'), async fd => {
    const sessionType = fd.get('type');
    const isShift = sessionType === 'shift';
    const baseSession = {
      id: uid(),
      type: sessionType,
      clientId: isShift ? '' : fd.get('clientId'),
      planId: isShift ? '' : (fd.get('planId') || ''),
      workoutIdx: isShift ? 0 : +(fd.get('workoutIdx') || 0),
      date: fd.get('date'),
      // Training fields
      time: isShift ? '' : fd.get('time'),
      duration: isShift ? '' : fd.get('duration'),
      // Shift fields
      startTime: isShift ? fd.get('startTime') : '',
      endTime: isShift ? fd.get('endTime') : '',
      hourlyRate: isShift ? fd.get('hourlyRate') : '',
      notes: fd.get('notes'),
      punchCardId: isShift ? '' : (fd.get('punchCardId') || ''),
      price: isShift ? '' : (fd.get('punchCardId') ? '' : (fd.get('price') ? +fd.get('price') : '')),
      isRecurring: false,
      recurringGroupId: ''
    };

    const isRecurring = fd.get('recurring') === 'on';
    if (isRecurring) {
      const weeks = Math.min(+(fd.get('recurringWeeks') || 12), 52);
      const groupId = uid();
      baseSession.isRecurring = true;
      baseSession.recurringGroupId = groupId;
      await saveItem('sessions', baseSession);
      const promises = [];
      for (let w = 1; w < weeks; w++) {
        promises.push(saveItem('sessions', {
          ...baseSession,
          id: uid(),
          date: addDays(baseSession.date, w * 7)
        }));
      }
      await Promise.all(promises);
      showToast(`נוצרו ${weeks} ${isShift ? 'משמרות' : 'אימונים'} קבועים ✓`);
    } else {
      await saveItem('sessions', baseSession);
    }
    renderSchedule();
  });
}
